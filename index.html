<style>
:root{
  --gold:#F8C000; --orange:#EA742E;
  --bg:#FAF8F5; --bg2:#F1ECE5; --card:#FFFFFF;
  --ink:#16130F; --ink2:#6B6257; --ink3:#9C9284;
  --line:rgba(22,19,15,.10); --line2:rgba(22,19,15,.055);
  --accent:#E8711F; --accent-s:rgba(232,113,31,.12); --accent-d:#C25A14;
  --green:#1B8F57; --green-s:rgba(27,143,87,.13);
  --blue:#2A6F97; --blue-s:rgba(42,111,151,.13);
  --slate:#64758A; --slate-s:rgba(100,117,138,.13);
  --rose:#BE3B2C; --rose-s:rgba(190,59,44,.12);
  --chrome:rgba(250,248,245,.82);
  --sh1:0 1px 2px rgba(22,19,15,.05);
  --sh2:0 1px 3px rgba(22,19,15,.06),0 10px 28px -12px rgba(22,19,15,.16);
  --e:cubic-bezier(.23,1,.32,1); --es:cubic-bezier(.32,.72,0,1);
  --r:16px; --nav:70px; --card2:#F7F4EF; --yel-ink:#8A6700;
}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]){
  --bg:#0F0D0C; --bg2:#191614; --card:#1B1917;
  --ink:#F5F1EA; --ink2:#A79D8F; --ink3:#776E62;
  --line:rgba(255,250,240,.11); --line2:rgba(255,250,240,.06);
  --accent:#F79A52; --accent-s:rgba(247,154,82,.16); --accent-d:#FBB574;
  --green:#4FC98D; --green-s:rgba(79,201,141,.16);
  --blue:#78B9E0; --blue-s:rgba(120,185,224,.16);
  --slate:#93A7BA; --slate-s:rgba(147,167,186,.16);
  --rose:#E7796A; --rose-s:rgba(231,121,106,.16);
  --chrome:rgba(15,13,12,.82); --card2:#211E1B; --yel-ink:#F8C000;
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 3px rgba(0,0,0,.5),0 14px 34px -14px rgba(0,0,0,.75);
}}
:root[data-t="dark"]{
  --bg:#0F0D0C; --bg2:#191614; --card:#1B1917;
  --ink:#F5F1EA; --ink2:#A79D8F; --ink3:#776E62;
  --line:rgba(255,250,240,.11); --line2:rgba(255,250,240,.06);
  --accent:#F79A52; --accent-s:rgba(247,154,82,.16); --accent-d:#FBB574;
  --green:#4FC98D; --green-s:rgba(79,201,141,.16);
  --blue:#78B9E0; --blue-s:rgba(120,185,224,.16);
  --slate:#93A7BA; --slate-s:rgba(147,167,186,.16);
  --rose:#E7796A; --rose-s:rgba(231,121,106,.16);
  --chrome:rgba(15,13,12,.82); --card2:#211E1B; --yel-ink:#F8C000;
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 3px rgba(0,0,0,.5),0 14px 34px -14px rgba(0,0,0,.75);
}
:root[data-t="dark"]{color-scheme:dark} :root[data-t="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.024em;line-height:1.14}
p{margin:0}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:50;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-transparency:reduce){.top{background:var(--bg);backdrop-filter:none}}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
@media(min-width:760px){.wrap{padding-inline:24px}}
.tbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.plate{background:#fff;border-radius:9px;padding:5px 8px;display:inline-flex;box-shadow:var(--sh1);flex:none}
.plate img{height:28px;display:block}
.sp{flex:1}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:var(--green);animation:pul 2.4s var(--e) infinite}
.dot.off{background:var(--orange)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.ico{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh1);flex:none;
  transition:transform .14s var(--e),background .2s}
.ico:active{transform:scale(.94)}
.ico svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.spin svg{animation:sp 900ms linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── filtros ── */
.fbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.fbar::-webkit-scrollbar{display:none}
@media(max-width:759px){.fbar{margin-inline:-16px;padding-inline:16px}}
@media(min-width:760px){.fbar{flex-wrap:wrap;overflow:visible;row-gap:8px}}
.chips{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px;flex:none}
.chips button{font-size:12.5px;font-weight:500;color:var(--ink2);background:none;border:0;border-radius:9px;
  padding:7px 13px;cursor:pointer;white-space:nowrap;transition:color .18s,background .22s var(--e),transform .14s var(--e)}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
.chips button[data-p=hoje]{font-weight:600}
.chips button[data-p=hoje][aria-pressed=true]{background:linear-gradient(120deg,var(--gold),var(--orange));color:#fff}
.chips.b button[aria-pressed=true]{background:linear-gradient(120deg,var(--gold),var(--orange));color:#fff}
select{font-size:12.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;
  padding:8px 28px 8px 12px;cursor:pointer;flex:none;max-width:160px;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%239C9284' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
input[type=date]{font-size:12.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);
  border-radius:12px;padding:8px 10px;flex:none}


/* ── performance ── */
.fun{display:flex;flex-direction:column;gap:7px;margin:4px 0 10px}
.fst{position:relative;border-radius:10px;overflow:hidden;background:var(--line2);padding:9px 12px;
  animation:rise .4s var(--e) both}
.fst .fnb{position:absolute;inset:0;right:auto;opacity:.22;border-radius:10px}
.fst .fl{position:relative;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.02em;text-transform:uppercase}
.fst .fv{position:relative;font-size:19px;font-weight:650;color:var(--ink);letter-spacing:-.02em}
.pac{margin-top:10px}
.pacb{position:relative;height:10px;border-radius:6px;background:var(--line2);overflow:visible}
.pacb i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .5s var(--e)}
.pacb u{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.5;border-radius:1px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;
  margin:4px 6px 0 0;transition:transform .14s var(--e),background .2s}
.btn:hover{background:var(--line2)} .btn:active{transform:scale(.96)}
.lnk{appearance:none;background:none;border:0;color:var(--accent);font:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer;padding:8px 0 0}
.sortb{appearance:none;background:none;border:0;color:inherit;font:inherit;font-size:inherit;
  font-weight:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;white-space:nowrap}
.sortb:hover{color:var(--accent)}
tr.crow{cursor:pointer} tr.crow:hover td{background:var(--line2)}
.chips.ptab{flex-wrap:wrap}
@media print{
  .nav,.fbar,header .chips,.ptab,.gran,.fbase,#rf,.btn,.lnk{display:none!important}

function jp(base,params,q,ms,fonte){const t0=performance.now();return new Promise((res,rej)=>{
  const cb='__j'+Math.random().toString(36).slice(2,9);let s,t,feito=false;
  const fim=()=>{feito=true;try{delete window[cb]}catch(e){window[cb]=void 0};if(s&&s.parentNode)s.remove();clearTimeout(t)};
  const falha=m=>{if(feito)return;fim();logEv(fonte,q,false,0,Math.round(performance.now()-t0),m);rej(Error(m))};
  t=setTimeout(()=>falha('Tempo esgotado'),ms);
  window[cb]=r=>{if(feito)return;
    if(!(r&&r.table)){const e=r&&r.errors&&r.errors[0];return falha(e?(e.detailed_message||e.message):'Sem dados')}
    fim();const rows=r.table.rows.map(x=>(x.c||[]).map(c=>c?c.v:null));
    logEv(fonte,q,true,rows.length,Math.round(performance.now()-t0));res(rows)};
  s=document.createElement('script');
  s.src="https://docs.google.com/spreadsheets/d/"+base+"/gviz/tq?tqx=out:json;responseHandler:"+cb+";reqId:"+Date.now()+params+"&tq="+encodeURIComponent(q);
  s.onerror=()=>falha('Bloqueado (sem acesso à planilha)');document.head.appendChild(s)})}
function gviz(q,ms=25000){return jp(SID,"&sheet="+encodeURIComponent(SNAME),q,ms,'Leads')}
function gvizF(q,ms=30000){return jp(FSID,"&gid="+FGID,q,ms,'Faturamento')}
function gvizK(sheet,q,headers,ms=30000){return jp(KSID,"&sheet="+encodeURIComponent(sheet)+(headers!=null?"&headers="+headers:""),q,ms,'Custos · '+sheet)}
/* origem e canal entram na consulta da série diária (para os gráficos por dia/semana/mês acompanharem o filtro) */
const lit=v=>String(v).indexOf("'")>=0?'"'+String(v).replace(/"/g,'')+'"':"'"+v+"'";
function filtroOC(o,c){o=o===undefined?fO:o;c=c===undefined?fC:c;let s='';
  if(o!=='TODAS')s+=o===BL?` and (${ORI} is null or ${ORI} = '')`:` and ${ORI} = ${lit(o)}`;
  if(c!=='TODAS')s+=c===BL?` and (${CAN} is null or ${CAN} = '')`:` and ${CAN} = ${lit(c)}`;
  return s}
const wh=()=>(d1&&d2)?` where ${DAT} >= date '${d1}' and ${DAT} <= date '${d2}'`:'';

/* ───── seleção ───── */
function sel(){let r=CUBE;
  if(fE!=='TODAS')r=r.filter(x=>empOf(x[0])===fE);
  if(fCamp)r=r.filter(x=>x[0]===fCamp);
  if(fO!=='TODAS')r=r.filter(x=>(x[2]||BL)===fO);
  if(fC!=='TODAS')r=r.filter(x=>(x[3]||BL)===fC);
  return r}
function agg(rows){const byC={},byT={},byE={};
  rows.forEach(x=>{const c=x[0]||BL;byC[c]=(byC[c]||0)+x[4];
    const t=(x[1]&&x[1]!=='-')?x[1]:'Sem tabulação';byT[t]=(byT[t]||0)+x[4];
    const e=empOf(x[0]);if(e!=='—')byE[e]=(byE[e]||0)+x[4]});
  const tot=rows.reduce((s,x)=>s+x[4],0);
  const g=rows.filter(x=>kind(x[1])==='g').reduce((s,x)=>s+x[4],0);
  const d=rows.filter(x=>/^discador/i.test(String(x[1]||''))).reduce((s,x)=>s+x[4],0);
  return{byC,byT,byE,tot,venda:g,disc:d}}
const srt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const uni=i=>[...new Set(CUBE.map(x=>x[i]||BL))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
/* campanhas disponiveis: so as da empresa escolhida (todas quando empresa=TODAS) */
const campsDe=()=>[...new Set([
    ...CUBE.filter(x=>fE==='TODAS'||empOf(x[0])===fE).map(x=>x[0]),
    ...SALES.filter(x=>fE==='TODAS'||x.e===fE).map(x=>x.mi)
  ].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

/* ───── séries / buckets ───── */
function inRange(s){return (!d1||s>=d1)&&(!d2||s<=d2)}
function bucket(s){const d=parse(s);
  if(gran==='mes')return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if(gran==='semana'){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return iso(x)}
  return s}
function bLabel(k){
  if(gran==='mes'){const[y,m]=k.split('-');return MES[+m-1]+'/'+y.slice(2)}
  if(gran==='semana')return brd(k);
  return brd(k)}
function serieFiltrada(){
  const m={};
  SER.forEach(([s,c,t,q])=>{
    if(c){ if(fE!=='TODAS'&&empOf(c)!==fE)return; if(fCamp&&c!==fCamp)return;
      if(typeof onOk==='function'&&!onOk(c))return }
    const o=m[s]||(m[s]=[0,0,0]); o[0]+=q; if(kind(t)==='g')o[1]+=q; if(kind(t)==='b')o[2]+=q});
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,v])=>[s,v[0],v[1],v[2]])}
function series(from,to){
  const m={};
  SERIE.forEach(([s,l,v,f])=>{ if(from&&s<from)return; if(to&&s>to)return;
    const k=bucket(s); m[k]=m[k]||{l:0,v:0,f:0}; m[k].l+=l; m[k].v+=v; m[k].f+=f});
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))}
/* período anterior de mesmo tamanho */
function prevRange(){ if(!d1||!d2)return[null,null];
  const a=parse(d1),b=parse(d2);
  /* período que começa no dia 1 dentro de um mês: compara com o mesmo trecho do mês anterior
     (01–23/09 → 01–23/08; mês fechado → mês anterior inteiro) */
  if(d1!==d2&&a.getDate()===1&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear()){
    const ult=new Date(a.getFullYear(),a.getMonth(),0).getDate();
    const fimMes=b.getDate()===new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
    const pm=new Date(a.getFullYear(),a.getMonth()-1,1);
    return[iso(pm),iso(new Date(pm.getFullYear(),pm.getMonth(),fimMes?ult:Math.min(b.getDate(),ult)))]}const dias=Math.round((b-a)/864e5)+1;
  const pb=new Date(a);pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-(dias-1));
  return[iso(pa),iso(pb)]}
function sumSerie(from,to){let l=0,v=0,f=0;
  SERIE.forEach(([s,a,b,c])=>{if(from&&s<from)return;if(to&&s>to)return;l+=a;v+=b;f+=c});return{l,v,f}}

/* ───── delta ───── */
function delta(cur,prev,invert){
  if(!prev)return{cls:'flat',txt:'—',arw:''};
  const p=(cur-prev)/prev*100;
  const good=invert? p<0 : p>0;
  const cls=Math.abs(p)<0.5?'flat':(good?'up':'dn');
  return{cls,txt:(p>0?'+':'')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',
    arw:Math.abs(p)<0.5?'':(p>0?'u':'d')}}

/* ───── gráficos SVG ───── */
function area(pts,color,h){ /* pts: [[label,val]] */
  const w=CW(); h=(w>=880?230:(h||155)); const pl=34,pr=24,pt=12,pb=24;
  if(!pts.length)return '<div class="info">Sem dados no período.</div>';
  const mx=Math.max(...pts.map(p=>p[1]),1);
  const X=i=>pl+(w-pl-pr)*(pts.length<2?0.5:i/(pts.length-1));
  const Y=v=>pt+(h-pt-pb)*(1-v/mx);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
  const fill=`${line} L${X(pts.length-1).toFixed(1)} ${h-pb} L${X(0).toFixed(1)} ${h-pb} Z`;
  const ticks=[0,.5,1].map(f=>{const v=mx*f,y=Y(v);
    return `<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
            <text class="ax" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${n(v)}</text>`}).join('');
  const step=Math.max(1,Math.ceil(pts.length/6));
  const lbl=pts.map((p,i)=>i%step===0||i===pts.length-1?
    `<text class="ax" x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(bLabel(p[0]))}</text>`:'').join('');
  const id='g'+Math.random().toString(36).slice(2,7);
  const dots=pts.length<=31?pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.4" fill="${color}"><title>${esc(bLabel(p[0]))}: ${n(p[1])}</title></circle>`).join(''):'';
  return `<div class="cw"><svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>${ticks}
    <path d="${fill}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${lbl}</svg></div>`}

function bars(pts,color,h){
  const w=CW(); h=(w>=880?250:(h||165)); const pl=34,pr=24,pt=12,pb=26;
  if(!pts.length)return '<div class="info">Sem dados no período.</div>';
  const mx=Math.max(...pts.map(p=>p[1]),1),N=pts.length;
  const bw=Math.max(3,Math.min(26,(w-pl-pr)/N*0.68));
  const X=i=>pl+(w-pl-pr)*((i+0.5)/N);
  const Y=v=>pt+(h-pt-pb)*(1-v/mx);
  const avg=pts.reduce((s,p)=>s+p[1],0)/N;
  const ticks=[0,.5,1].map(f=>{const v=mx*f,y=Y(v);
    return `<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
            <text class="ax" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${n(v)}</text>`}).join('');
  const bs=pts.map((p,i)=>{const y=Y(p[1]),hh=Math.max(1,(h-pb)-y);
    return `<rect class="bar" x="${(X(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}"
      rx="${Math.min(3,bw/2).toFixed(1)}" fill="${color}" style="animation-delay:${Math.min(i*22,500)}ms"><title>${esc(bLabel(p[0]))}: ${n(p[1])}</title></rect>`}).join('');
  const ay=Y(avg);
  const step=Math.max(1,Math.ceil(N/6));
  const lbl=pts.map((p,i)=>i%step===0||i===N-1?
    `<text class="ax" x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(bLabel(p[0]))}</text>`:'').join('');
  return `<div class="cw"><svg class="chart" viewBox="0 0 ${w} ${h}">${ticks}${bs}
    <line x1="${pl}" x2="${w-pr}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="${color}" stroke-width="1.2" stroke-dasharray="4 4" opacity=".55"/>
    <text class="ax" x="${w-pr}" y="${(ay-4).toFixed(1)}" text-anchor="end" fill="${color}">média ${n(avg)}</text>
    ${lbl}</svg></div>`}

function donut(slices,total){
  const R=52,C=2*Math.PI*R,w=150;let off=0;
  const arcs=slices.map((s,i)=>{const frac=total?s.v/total:0,len=C*frac;
    const el=`<circle class="arc" cx="75" cy="75" r="${R}" fill="none" stroke="${s.c}" stroke-width="18"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 75 75)" stroke-linecap="butt"><title>${esc(s.k)}: ${n(s.v)}</title></circle>`;
    off+=len;return el}).join('');
  return `<div class="cw" style="max-width:${w}px;margin:0 auto"><svg class="chart" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line2)" stroke-width="18"/>${arcs}
    <text x="75" y="72" text-anchor="middle" style="font-size:19px;font-weight:650;fill:var(--ink)" class="num">${n(total)}</text>
    <text x="75" y="88" text-anchor="middle" style="font-size:9.5px;fill:var(--ink3)">leads</text></svg></div>`}

function spark(vals,color){
  if(vals.length<2)return'';
  const w=62,h=26,mx=Math.max(...vals,1);
  const p=vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)} ${(h-(v/mx)*(h-3)-1).toFixed(1)}`).join(' ');
  return `<svg class="spk" viewBox="0 0 ${w} ${h}"><path d="${p}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

/* contador animado */
function countUp(el,to){
  if(RM){el.textContent=typeof to==='string'?to:n(to);return}
  if(typeof to==='string'){el.textContent=to;return}
  const t0=performance.now(),dur=650;
  const st=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=n(to*e); if(p<1)requestAnimationFrame(st)};
  requestAnimationFrame(st)}

/* ───── KPI helper ───── */
function kpi(lab,val,d,cls,spk,i,note){
  const dd=note?`<div class="kd flat">${note}</div>`
    :(d?`<div class="kd ${d.cls}">${d.arw?`<span class="arw ${d.arw}"></span>`:''}${d.txt}<span style="color:var(--ink3);font-weight:400"> vs anterior</span></div>`:'');
  return `<div class="k ${cls||''}" style="animation-delay:${i*45}ms">
    <div class="kl">${lab}</div><div class="kv num" data-v="${typeof val==='number'?val:''}">${typeof val==='number'?'0':val}</div>${dd}${spk||''}</div>`}
function animKPIs(root){const q=document.body.classList.contains('quieto');
  root.querySelectorAll('.kv[data-v]').forEach(el=>{
  const v=el.getAttribute('data-v'); if(v!=='')(q?(el.textContent=n(+v)):countUp(el,+v))})}

/* ───── VIEWS ───── */
function vResumo(){
  const A=agg(sel()),P=prevRange();
  const cur=sumSerie(d1,d2),prv=sumSerie(P[0],P[1]);
  const s=series(d1,d2);
  const leadsSerie=s.map(x=>[x[0],x[1].l]);
  const conv=A.tot?A.venda/A.tot:0;
  const convPrev=prv.l&&prv.v?prv.v/prv.l:0;
  const html=`
  ${live?'':warnBox()}
  <div class="kg">
    ${kpi('Leads',live?A.tot:(cur.l||A.tot),delta(cur.l||A.tot,prv.l),'a',spark(leadsSerie.map(x=>x[1]),'var(--accent)'),0)}
    ${kpi('Vendas novas',A.venda,live?delta(cur.v,prv.v):null,'g','',1,live?null:'todo o período')}
    ${kpi('Conversão',pc(A.venda,A.tot),live&&convPrev?delta(conv,convPrev):null,'','',2,live?null:'todo o período')}
    ${kpi('No discador',A.disc,null,'','',3,live?null:'todo o período')}
  </div>
  <div class="card wide"><div class="ch"><h3>Entrada de leads</h3><span class="m">${granLabel()}</span></div>
    ${area(leadsSerie,'var(--accent)',160)}
    <div class="lgd"><span><i style="background:var(--accent)"></i>Leads</span></div></div>
  <div class="card"><div class="ch"><h3>Top campanhas</h3><span class="m">${srt(A.byC).length} no total</span></div>
    ${listRows(srt(A.byC).slice(0,5),A.tot,c=>`<span class="tg s">${esc(empOf(c))}</span>`)}</div>
  <div class="card"><div class="ch"><h3>Qualidade das tabulações</h3></div>
    ${listRows(srt(A.byT).slice(0,6),A.tot,null,true)}</div>`;
  return html}

function granLabel(){return gran==='dia'?'por dia':gran==='semana'?'por semana':'por mês'}

function vLeads(){
  const s=series(d1,d2),pts=s.map(x=>[x[0],x[1].l]);
  const tot=pts.reduce((a,p)=>a+p[1],0),avg=pts.length?tot/pts.length:0;
  const best=pts.slice().sort((a,b)=>b[1]-a[1])[0],worst=pts.slice().sort((a,b)=>a[1]-b[1])[0];
  const P=prevRange(),prv=sumSerie(P[0],P[1]);
  const rows=pts.map((p,i)=>{const pr=i>0?pts[i-1][1]:null;const d=pr?delta(p[1],pr):null;
    return `<tr><td>${esc(bLabel(p[0]))}</td><td><b>${n(p[1])}</b></td>
      <td>${d?`<span class="dl ${d.cls}">${d.txt}</span>`:'—'}</td></tr>`}).reverse().join('');
  return `${live?'':warnBox()}
  <div class="kg">
    ${kpi('Total',tot,delta(tot,prv.l),'a','',0)}
    ${kpi('Média '+(gran==='dia'?'/dia':gran==='semana'?'/semana':'/mês'),Math.round(avg),null,'','',1)}
    ${kpi('Melhor',best?best[1]:0,null,'g','',2)}
    ${kpi('Menor',worst?worst[1]:0,null,'','',3)}
  </div>
  <div class="card wide"><div class="ch"><h3>Volume de leads</h3><span class="m">${granLabel()}</span></div>
    ${bars(pts,'var(--orange)',170)}</div>
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Detalhe</h3><span class="m">${pts.length} períodos</span></div>
    <div class="tw"><table><thead><tr><th>Período</th><th>Leads</th><th>Variação</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="3">Sem dados.</td></tr>'}</tbody></table></div></div>`}

function vCamp(){
  const A=agg(sel());
  const list=srt(A.byC);
  const rows=sel().reduce((m,x)=>{const c=x[0]||BL;m[c]=m[c]||{t:0,v:0,d:0};m[c].t+=x[4];
    if(kind(x[1])==='g')m[c].v+=x[4]; if(/^discador/i.test(String(x[1]||'')))m[c].d+=x[4];return m},{});
  const tr=list.map(([c,v])=>{const o=rows[c]||{t:0,v:0,d:0};
    return `<tr><td>${esc(c)}</td><td>${n(v)}</td><td><b>${n(o.v)}</b></td><td>${pc(o.v,o.t)}</td>
      <td>${n(o.d)}</td></tr>`}).join('');
  return `${live?'':warnBox()}
  <div class="card"><div class="ch"><h3>Ranking por volume</h3><span class="m">${list.length} campanhas</span></div>
    ${listRows(list,A.tot,c=>`<span class="tg s">${esc(empOf(c))}</span>`,false,true)}</div>
  <div class="card t"><div class="ch" style="padding:15px 16px 8px"><h3>Desempenho</h3></div>
    <div class="tw"><table><thead><tr><th>Campanha</th><th>Leads</th><th>Vendas</th><th>Conv.</th><th>Discador</th></tr></thead>
    <tbody>${tr||'<tr><td colspan="5">Sem dados.</td></tr>'}</tbody></table></div></div>`}

function vEmp(){
  const A=agg(sel()),E=srt(A.byE);
  const per=sel().reduce((m,x)=>{const e=empOf(x[0]);if(e==='—')return m;
    m[e]=m[e]||{t:0,v:0,d:0};m[e].t+=x[4];
    if(kind(x[1])==='g')m[e].v+=x[4]; if(/^discador/i.test(String(x[1]||'')))m[e].d+=x[4];return m},{});
  const cols={GWA:'var(--orange)',M12:'var(--gold)',OFF:'var(--slate)'};
  const slices=E.map(([k,v])=>({k,v,c:cols[k]||'var(--blue)'}));
  const cards=E.map(([e,v],i)=>{const o=per[e];
    return `<div class="card" style="animation-delay:${i*50}ms"><div class="ch">
      <h3>${esc(e)}</h3><span class="m">${pc(v,A.tot)} dos leads</span></div>
      <div class="kg" style="margin:0">
        ${kpi('Leads',o.t,null,'a','',0)}${kpi('Vendas novas',o.v,null,'g','',1)}
        ${kpi('Conversão',pc(o.v,o.t),null,'','',2)}${kpi('No discador',o.d,null,'','',3)}
      </div></div>`}).join('');
  const fin=(CUSTO.length||FIN.length)?byEmp():null;
  const tI=fin?Object.values(fin).reduce((a,o)=>a+o.inv,0):0;
  const tF=fin?Object.values(fin).reduce((a,o)=>a+o.fat,0):0;
  const M=fin?metPeriodo():null;
  const resumo=fin?`
  <div class="kg">
    ${kpi('Leads',A.tot,null,'a','',0)}
    ${kpi('Investimento',moS(M.inv),null,'','',1)}
    ${kpi('Faturamento',moS(M.fat),null,'g','',2)}
    ${kpi('ROAS',xN(M.roas),null,'g','',3)}
  </div>
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Resumo por empresa</h3>
    <span class="m">leads, custo e faturamento</span></div>
    <div class="tw"><table><thead><tr><th>Empresa</th><th>Leads</th><th>Vendas</th><th>Conv.</th>
      <th>Investimento</th><th>CPL</th><th>CAC</th><th>Faturamento</th><th>Ticket</th><th>ROAS</th><th>Margem</th></tr></thead>
    <tbody>${Object.entries(fin).sort((a,b)=>b[1].fat-a[1].fat).map(([k,o])=>
      `<tr><td><b>${esc(k)}</b></td><td>${n(o.leads)}</td><td>${n(o.nv)}</td><td>${pctN(o.conv)}</td>

/* ═════════ FATURAMENTO ═════════ */
const ddiff=(a,b)=>(a&&b)?Math.round((parse(b)-parse(a))/864e5):null;
function buildSales(){const m={};
  FIN.forEach(f=>{let o=m[f.id];
    if(!o)o=m[f.id]={id:f.id,e:f.e,mi:f.mi,sv:f.sv,ld:f.ld,vc:f.vc,cs:f.cs,dc:f.dc,ck:f.ck,tot:0,np:0};
    if(!o.ck&&f.ck)o.ck=f.ck;
    o.tot+=f.v;o.np++;
    if(f.vc&&(!o.vc||f.vc<o.vc))o.vc=f.vc;
    if(f.ld&&!o.ld)o.ld=f.ld});
  SALES=Object.values(m)}
const finDate=x=>fBase==='lead'?x.ld:x.vc;
const finOk=x=>(fE==='TODAS'||x.e===fE)&&(!fCamp||x.mi===fCamp)&&(fServ==='TODAS'||x.sv===fServ);
const finParc=()=>FIN.filter(x=>finOk(x)&&finDate(x)&&inRange(finDate(x)));
const finSales=()=>SALES.filter(x=>finOk(x)&&finDate(x)&&inRange(finDate(x)));
const servs=()=>[...new Set(FIN.map(x=>x.sv).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

/* agrupa por chave: fat (parcelas), vendas/ticket/tempo (por venda) */
function finBy(P,S,k){const m={};
  const get=x=>m[x]||(m[x]={fat:0,nv:0,tot:0,dsum:0,dn:0});
  P.forEach(x=>{get(x[k]||'—').fat+=x.v});
  S.forEach(x=>{const o=get(x[k]||'—');o.nv++;o.tot+=x.tot;
    const d=ddiff(x.ld,x.vc);if(d!=null&&d>=0){o.dsum+=d;o.dn++}});
  return m}
/* leads do recorte por empresa / por campanha (base comercial) */
function leadsBy(mode){const m={};
  sel().forEach(x=>{const k=mode==='e'?empOf(x[0]):(x[0]||BL);m[k]=(m[k]||0)+x[4]});return m}

const BK=[['Mesmo dia',d=>d===0],['1 a 3 dias',d=>d>=1&&d<=3],['4 a 7 dias',d=>d>=4&&d<=7],
  ['8 a 15 dias',d=>d>=8&&d<=15],['16 a 30 dias',d=>d>=16&&d<=30],['Mais de 30 dias',d=>d>30]];

function finEmpty(){return `<div class="card"><p class="info">${finErr
  ? 'Nao foi possivel ler a planilha de faturamento ('+esc(finErr)+'). Confira se ela esta publicada na web.'
  : 'Carregando os dados de faturamento...'}</p></div>`}

/* barras de valor + linha de quantidade */
function duo(pts,cA,cB,la,lb){
  const dinheiro=lb==='Investimento';
  const w=CW(); const h=(w>=880?250:170); const pl=dinheiro?64:52,pr=dinheiro?14:44,pt=14,pb=26;
  if(!pts.length)return '<div class="info">Sem dados no período.</div>';
  let mv=Math.max(...pts.map(p=>p[1]),1), mq=Math.max(...pts.map(p=>p[2]),1); const N=pts.length;
  if(dinheiro){mv=mq=Math.max(mv,mq)}
  const bw=Math.max(3,Math.min(24,(w-pl-pr)/N*0.66));
  const X=i=>pl+(w-pl-pr)*((i+0.5)/N);
  const Y=v=>pt+(h-pt-pb)*(1-v/mv);
  const Yq=v=>pt+(h-pt-pb)*(1-v/mq);
  const ticks=[0,.5,1].map(f=>{const v=mv*f,y=Y(v);
    return `<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
      <text class="ax" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${moS(v)}</text>
      ${dinheiro?'':`<text class="ax" x="${w-pr+5}" y="${(Yq(mq*f)+3).toFixed(1)}" text-anchor="start">${n(mq*f)}</text>`}`}).join('');
  const bs=pts.map((p,i)=>{const y=Y(p[1]),hh=Math.max(1,(h-pb)-y);
    return `<rect class="bar" x="${(X(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}"
      rx="${Math.min(3,bw/2).toFixed(1)}" fill="${cA}" style="animation-delay:${Math.min(i*20,480)}ms"><title>${esc(bLabel(p[0]))}: ${mo(p[1])} · ${(lb==='Investimento')?mo(p[2]):n(p[2])}</title></rect>`}).join('');
  const ln=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Yq(p[2]).toFixed(1)}`).join(' ');
  const step=Math.max(1,Math.ceil(N/6));
  const lbl=pts.map((p,i)=>i%step===0||i===N-1?
    `<text class="ax" x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(bLabel(p[0]))}</text>`:'').join('');
  return `<div class="cw"><svg class="chart" viewBox="0 0 ${w} ${h}">${ticks}${bs}
    <path d="${ln}" fill="none" stroke="${cB}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    ${lbl}</svg></div>
    <div class="lgd"><span><i style="background:${cA}"></i>${la||'Faturamento'}</span><span><i style="background:${cB}"></i>${lb||'Vendas'}</span></div>`}

  if(!FIN.length)return finEmpty();

  const nv=S.length;

  const dias=S.map(x=>ddiff(x.ld,x.vc)).filter(d=>d!=null&&d>=0);
  const tmed=dias.length?dias.reduce((a,b)=>a+b,0)/dias.length:0;
  const A=agg(sel()), leads=A.tot;

    <td>${o.dn?dd1(o.dsum/o.dn)+'d':'—'}</td><td>${pc(o.fat,fat)}</td></tr>`).join('');
  const trS=ordS.map(([k,o])=>`<tr><td>${esc(k)}</td><td>${n(o.nv)}</td><td>${mo(o.fat)}</td>
    <td>${mo(o.nv?o.tot/o.nv:0)}</td><td>${pc(o.fat,fat)}</td></tr>`).join('');

  /* cruzamentos */
  const cross=(ka,kb)=>{const m={};S.forEach(x=>{const k=(x[ka]||'—')+' › '+(x[kb]||'—');m[k]=m[k]||{fat:0,nv:0}});
    P.forEach(x=>{const k=(x[ka]||'—')+' › '+(x[kb]||'—');m[k]=m[k]||{fat:0,nv:0};m[k].fat+=x.v});
    S.forEach(x=>{const k=(x[ka]||'—')+' › '+(x[kb]||'—');m[k].nv++});
    return Object.entries(m).sort((a,b)=>b[1].fat-a[1].fat).slice(0,10)};
  const xES=cross('e','sv'), xCS=cross('mi','sv');

  /* tempo de fechamento */
  const tE=ordE.filter(x=>x[1].dn).map(([k,o])=>[k,o.dsum/o.dn]).sort((a,b)=>a[1]-b[1]);
  const tC=ordC.filter(x=>x[1].dn).map(([k,o])=>[k,o.dsum/o.dn]).sort((a,b)=>a[1]-b[1]);
  const tS=ordS.filter(x=>x[1].dn).map(([k,o])=>[k,o.dsum/o.dn]).sort((a,b)=>a[1]-b[1]);
  const buck=BK.map(([l,f])=>[l,dias.filter(f).length]);

  const cols={GWA:'var(--orange)',M12:'var(--gold)',OFF:'var(--slate)',IND:'var(--blue)'};
  const slicesE=ordE.map(([k,o])=>({k,v:o.fat,c:cols[k]||'var(--green)'}));

  return `

  <i>Valor Líquido por Parcela</i> das parcelas com vencimento no período. A <b>venda</b> é o lançamento
  (contrato), contado uma única vez pela data da 1ª parcela — por isso o ticket médio pode ser maior que o
  faturamento do mês em vendas parceladas. O <b>tempo de fechamento</b> é a diferença entre a
  <i>Data de Criação do Lead</i> e a data da venda.</div></div>
  <div class="kg">
    ${kpi('Faturamento',moS(fat),null,'a','',0)}
    ${kpi('Vendas',nv,null,'g','',1)}
    ${kpi('Ticket médio',moS(tk),null,'','',2)}
    ${kpi('Tempo médio p/ fechar',dd1(tmed)+' d',null,'','',3)}
  </div>
  <div class="kg">
    ${kpi('Conversão no mês',dd1(convMes)+'%',null,'g','',0,'lead entrou e vendeu no período')}
    ${kpi('Conversão global',dd1(convGlob)+'%',null,'','',1,'todas as vendas do período')}
    ${kpi('Leads do período',leads,null,'a','',2)}
    ${kpi('Empresas / campanhas',n(nE)+' / '+n(nC),null,'','',3,'com vendas no período')}
  </div>
  <div class="card wide"><div class="ch"><h3>De onde vieram as vendas</h3><span class="m">${n(nv)} vendas</span></div>
    <div class="kg" style="margin:0">

    </div>
    <div class="tw" style="margin-top:6px"><table><tbody>
      <tr><td>Leads recebidos no período</td><td class="num"><b>${n(leads)}</b></td></tr>
      <tr><td>Vendas de leads do próprio período</td><td class="num"><b>${n(doMes.length)}</b></td></tr>
      <tr><td>Conversão dentro do período</td><td class="num"><b>${dd1(convMes)}%</b></td></tr>
      <tr><td>Vendas totais no período</td><td class="num"><b>${n(nv)}</b></td></tr>
      <tr><td>Vendas vindas de leads anteriores</td><td class="num"><b>${n(antigos.length)}</b></td></tr>
      <tr><td>Conversão global</td><td class="num"><b>${dd1(convGlob)}%</b></td></tr>
    </tbody></table></div></div>

  <div class="card"><div class="ch"><h3>Faturamento por empresa</h3><span class="m">${mo(fat)}</span></div>
    <div class="dw">${donutV(slicesE,fat)}
    <div class="lgd">${slicesE.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.k)} · ${moS(s.v)}</span>`).join('')}</div></div></div>
  <div class="card"><div class="ch"><h3>Ranking de campanhas</h3><span class="m">${ordC.length} com venda</span></div>
    ${finRows(ordC.map(([k,o])=>[k,o.fat]),fat,moS,k=>`<span class="tg s">${esc(empOf(k))}</span>`,'g')}</div>

  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Empresas</h3></div>

    <tbody>${trE||'<tr><td colspan="7">Sem vendas no período.</td></tr>'}</tbody></table></div></div>

    <tbody>${trC||'<tr><td colspan="8">Sem vendas no período.</td></tr>'}</tbody></table></div></div>

  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Serviços</h3></div>

/* donut com rotulo em dinheiro */
function donutV(slices,total,lab){
  const R=52,C=2*Math.PI*R;let off=0;
  const arcs=slices.map(s=>{const frac=total?s.v/total:0,len=C*frac;
    const el=`<circle class="arc" cx="75" cy="75" r="${R}" fill="none" stroke="${s.c}" stroke-width="18"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 75 75)"><title>${esc(s.k)}: ${mo(s.v)}</title></circle>`;
    off+=len;return el}).join('');
  return `<div class="cw" style="max-width:150px;margin:0 auto"><svg class="chart" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line2)" stroke-width="18"/>${arcs}
    <text x="75" y="74" text-anchor="middle" style="font-size:14px;font-weight:650;fill:var(--ink)" class="num">${moS(total)}</text>
    <text x="75" y="89" text-anchor="middle" style="font-size:9.5px;fill:var(--ink3)">${lab||'faturamento'}</text></svg></div>`}

/* ───── VIEW: Vendas gerais ───── */
function vVendas(){
  if(!FIN.length)return finEmpty();
  const P=finParc(), S=finSales();
  const fat=P.reduce((a,x)=>a+x.v,0), nv=S.length;
  const tk=nv?S.reduce((a,x)=>a+x.tot,0)/nv:0;
  const dias=S.map(x=>ddiff(x.ld,x.vc)).filter(d=>d!=null&&d>=0);
  const tmed=dias.length?dias.reduce((a,b)=>a+b,0)/dias.length:0;
  const A=agg(sel()), leads=A.tot;

  /* evolucao: valor por parcela vencida + qtd de vendas */
  const m={};
  P.forEach(x=>{const k=bucket(finDate(x));m[k]=m[k]||[0,0];m[k][0]+=x.v});
  S.forEach(x=>{const k=bucket(finDate(x));m[k]=m[k]||[0,0];m[k][1]++});
  const pts=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>[k,v[0],v[1]]);
  let ac=0;const acum=pts.map(p=>{ac+=p[1];return[p[0],ac]});

  const byE=finBy(P,S,'e'), byC=finBy(P,S,'mi'), byS=finBy(P,S,'sv');

/* ═════════ PERFORMANCE · CUSTOS · RENTABILIDADE ═════════ */
const SRCLAB={META:'Meta Ads',ADS:'Google Ads',OFFLINE:'Offline'};
const SRCCOL={META:'var(--blue)',ADS:'var(--orange)',OFFLINE:'var(--gold)'};
const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const serial=v=>{const ms=(Number(v)-25569)*864e5;const d=new Date(ms);
  return isNaN(d)?null:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`};
const MESPT={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const diasNoMes=(y,m)=>new Date(y,m,0).getDate();
const isUtil=s=>{const w=parse(s).getDay();return w>=1&&w<=5};
/* divisao segura: devolve '—' quando nao da pra calcular */
const sdiv=(a,b)=>(b&&isFinite(a/b))?a/b:null;
const fmtOr=(v,f)=>v==null?'—':f(v);
const pctN=v=>v==null?'—':dd1(v*100)+'%';
const xN=v=>v==null?'—':dd1(v)+'x';

/* ───── montagem da base consolidada de custos ───── */
function buildCusto(meta,ads,off){
  const out=[];
  /* 1. META (RELATORIO_CAMPANHAS_2026) — mensal: A mes, I valor gasto, L campanha, M empresa */
  /* colunas pedidas: A mes, I gasto, L campanha, M empresa (+ F empresa da conta e K atualizacao, so como apoio) */
  const EMPS=['GWA','M12','OFF','IND'];
  EXCL={n:0,v:0,porMes:{}};
  (meta||[]).forEach(r=>{
    const mm=String(r[0]||'').trim().match(/^(\d{1,2})\s*\/\s*(\d{4})$/); if(!mm)return;
    const val=+r[1]||0; if(!val)return;
    if(!String(r[2]==null?'':r[2]).trim()){            /* sem campanha mapeada: fora do painel */
      const k=mm[2]+'-'+String(+mm[1]).padStart(2,'0');EXCL.n++;EXCL.v+=val;
      const o=EXCL.porMes[k]||(EXCL.porMes[k]={v:0,n:0,contas:{}});o.v+=val;o.n++;
      const ct=String(r[4]||'—').trim()||'—';o.contas[ct]=(o.contas[ct]||0)+val;return}
    const camp=nc(r[2]);
    const fEmp=String(r[4]||'').trim().toUpperCase();
    const emp=String(r[3]||'').trim().toUpperCase()||(EMPS.indexOf(fEmp)>=0?fEmp:'NÃO MAPEADA');
    const y=+mm[2], m=+mm[1];
    let nd=diasNoMes(y,m);
    /* mes em andamento: o gasto acumulado vai ate o dia anterior a atualizacao, nao ate o fim do mes */
    const up=gdate(r[5]);
    if(up&&+up.slice(0,4)===y&&+up.slice(5,7)===m)nd=Math.max(1,+up.slice(8,10)-1);
    const q=val/nd;
    for(let d=1;d<=nd;d++)out.push({d:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
      camp,emp,val:q,src:'META',canal:'Meta',apx:true,semMapa:!r[2],conta:String(r[6]==null?'':r[6]).trim()});
  });
  /* 2. ADS (Custo campanhas Ads) — diario: A dia, E estado, F canal, K custo, P orcamento, Q campanha, R empresa */
  (ads||[]).forEach(r=>{
    const d=gdate(r[0]); if(!d)return; const val=+r[3]||0;
    if(!String(r[5]==null?'':r[5]).trim()){EXCL.n++;EXCL.v+=val;return}
    const camp=nc(r[5]), emp=String(r[6]||'').trim().toUpperCase()||empOf(camp);
    out.push({d,camp,emp,val,src:'ADS',canal:String(r[2]||'Google').trim(),
      estado:String(r[1]||'').trim(),budget:+r[4]||0,apx:false});
  });
  /* 3. OFFLINE (pivot): linha cabecalho com os dias, linhas de campanha com insercoes, X custo unitario */
  if(off&&off.length){
    const A=i=>String(off[i]&&off[i][0]!=null?off[i][0]:'').trim();
    let hdr=-1,fim=off.length,mesTxt='';
    off.forEach((r,i)=>{const a=A(i);
      if(hdr<0&&/CAMPANHA\s+PADRON/i.test(a))hdr=i;
      if(hdr>=0&&fim===off.length&&i>hdr&&/^TOTAL/i.test(a))fim=i;
      if(/M.S\s+DA\s+PROGRAMA/i.test(a))mesTxt=String(r[1]||'').trim()});
    let my=null,mm=null;
    const t=mesTxt.toLowerCase().match(/([a-zç]{3})\.?\s*\/\s*(\d{4})/);
    if(t&&MESPT[t[1]]){mm=MESPT[t[1]];my=+t[2]}
    if(hdr>=0){
      const H=off[hdr]||[];
      const dias=[];
      for(let c=1;c<22;c++){const v=H[c]; if(v==null||v==='')continue;
        const num=Number(v);
        if(isFinite(num)&&num>40000){const s=serial(num); if(s)dias.push([c,s])}
        else if(isFinite(num)&&num>=1&&num<=31&&my)dias.push([c,`${my}-${String(mm).padStart(2,'0')}-${String(num).padStart(2,'0')}`]);
      }
      for(let i=hdr+1;i<fim;i++){
        const camp=nc(A(i)); if(!camp||/^TOTAL/i.test(camp))continue;
        const unit=+(off[i][23])||0; if(!unit)continue;
        dias.forEach(([c,s])=>{const q=+(off[i][c])||0; if(q>0)
          out.push({d:s,camp,emp:empOf(camp),val:q*unit,src:'OFFLINE',canal:'Offline',ins:q,apx:false})});
      }
    }
  }
  return out}

/* mapa campanha -> online/offline (campanha so com custo offline conta como offline) */
let CAMPON={};
function buildCampOn(){CAMPON={};
  CUSTO.forEach(x=>{const o=CAMPON[x.camp]||(CAMPON[x.camp]={on:0,off:0});
    if(x.src==='OFFLINE')o.off+=x.val; else o.on+=x.val})}
const isOff=c=>{const o=CAMPON[c]; return !!(o&&o.off>0&&o.on===0)};
const onOk=c=>fOn==='TODOS'||(fOn==='OFF'?isOff(c):!isOff(c));

/* ───── seleções ───── */
function cRows(from,to){const a=from||d1,b=to||d2;
  return CUSTO.filter(x=>x.d&&(!a||x.d>=a)&&(!b||x.d<=b)
    &&(fE==='TODAS'||x.emp===fE)&&(!fCamp||x.camp===fCamp)&&onOk(x.camp))}
function lRows(){return sel().filter(x=>onOk(x[0]||''))}
function fParc(){return finParc().filter(x=>onOk(x.mi))}
function fSale(){return finSales().filter(x=>onOk(x.mi))}

/* bloco de metricas de um recorte */
function met(cost,leadsN,sales,parc){
  const inv=cost.reduce((a,x)=>a+x.val,0);
  const fat=parc.reduce((a,x)=>a+x.v,0);
  const nv=sales.length;
  const tot=sales.reduce((a,x)=>a+x.tot,0);
  return{inv,fat,leads:leadsN,nv,
    cpl:inv>0?sdiv(inv,leadsN):null, cac:inv>0?sdiv(inv,nv):null, ticket:sdiv(tot,nv),
    conv:leadsN>0?nv/leadsN:null, roi:inv>0?((fat-inv)/inv):null, roas:inv>0?sdiv(fat,inv):null,
    lucro:fat-inv, margem:(fat>0&&inv>0)?((fat-inv)/fat):null, mcusto:(fat>0&&inv>0)?(inv/fat):null}}
function metPeriodo(from,to){
  const a=from||d1, b=to||d2;                 /* sem argumentos = período selecionado */
  const cost=cRows(a,b);
  const dentro=s=>!!s&&(!a||s>=a)&&(!b||s<=b);
  const leads=(from||to)?sumSerie(a,b).l:lRows().reduce((s,x)=>s+x[4],0);
  const sl=SALES.filter(x=>finOk(x)&&onOk(x.mi)&&dentro(finDate(x)));
  const pc=FIN.filter(x=>finOk(x)&&onOk(x.mi)&&dentro(finDate(x)));
  return met(cost,leads,sl,pc)}

/* agrupamento por chave para tabelas */
function perfBy(keyC,keyL,keyF){
  const m={}, get=k=>m[k]||(m[k]={inv:0,leads:0,nv:0,fat:0,tot:0,dsum:0,dn:0,src:{}});
  cRows().forEach(x=>{const o=get(keyC(x));o.inv+=x.val;o.src[x.src]=(o.src[x.src]||0)+x.val});
  lRows().forEach(x=>{get(keyL(x)).leads+=x[4]});
  fParc().forEach(x=>{get(keyF(x)).fat+=x.v});
  fSale().forEach(x=>{const o=get(keyF(x));o.nv++;o.tot+=x.tot;
    const dd=ddiff(x.ld,x.vc);if(dd!=null&&dd>=0){o.dsum+=dd;o.dn++}});
  Object.values(m).forEach(o=>{
    o.cpl=o.inv>0?sdiv(o.inv,o.leads):null; o.cac=o.inv>0?sdiv(o.inv,o.nv):null;
    o.ticket=sdiv(o.tot,o.nv); o.conv=o.leads>0?o.nv/o.leads:null;
    o.roi=o.inv>0?((o.fat-o.inv)/o.inv):null; o.roas=o.inv>0?sdiv(o.fat,o.inv):null;
    o.margem=(o.fat>0&&o.inv>0)?((o.fat-o.inv)/o.fat):null;
    o.mcusto=(o.fat>0&&o.inv>0)?(o.inv/o.fat):null; o.tempo=sdiv(o.dsum,o.dn)});
  delete m['']; return m}
const byCamp=()=>perfBy(x=>x.camp,x=>x[0]||BL,x=>x.mi||'—');
const byEmp =()=>perfBy(x=>x.emp, x=>empOf(x[0]),  x=>x.e||'—');

/* série diária combinada */
function perfSerie(){
  const m={};
  const g=k=>m[k]||(m[k]={inv:0,leads:0,nv:0,fat:0});
  cRows().forEach(x=>g(bucket(x.d)).inv+=x.val);
  SERIE.forEach(([s,l])=>{if(inRange(s))g(bucket(s)).leads+=l});
  fParc().forEach(x=>g(bucket(finDate(x))).fat+=x.v);
  fSale().forEach(x=>g(bucket(finDate(x))).nv++);
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))}

/* dias úteis do mês do período selecionado */
function diasUteis(){
  const base=d2?parse(d2):hoje, y=base.getFullYear(), m=base.getMonth();
  const nd=diasNoMes(y,m+1); let tot=0,feitos=0;
  const hojeIso=iso(hoje);
  for(let i=1;i<=nd;i++){const s=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    if(!isUtil(s))continue; tot++; if(s<=hojeIso&&(!d2||s<=d2))feitos++}
  return{tot,feitos,rest:Math.max(0,tot-feitos),y,m:m+1,nd}}

/* ───── mini componentes ───── */
function statRow(items){return `<div class="tw"><table><tbody>${items.map(([k,v,b])=>
  `<tr><td>${k}</td><td class="num">${b?'<b>'+v+'</b>':v}</td></tr>`).join('')}</tbody></table></div>`}
function deltaCell(cur,prev,invert){
  if(cur==null||prev==null||!prev)return '<span class="dl flat">—</span>';
  const d=delta(cur,prev,invert);return `<span class="dl ${d.cls}">${d.txt}</span>`}
function hbar(list,total,fmt,color){
  if(!list.length)return '<div class="info">Sem dados no recorte.</div>';
  const mx=Math.max(...list.map(x=>x[1]),1);
  return list.map(([k,v],i)=>`<div class="row" style="animation-delay:${Math.min(i*30,400)}ms">

    <span class="mt ${color||''}"><i style="width:${Math.max(0,v/mx*100).toFixed(1)}%;animation-delay:${Math.min(i*30,400)}ms"></i></span>
  </div>`).join('')}
function perfEmpty(){return `<div class="card"><p class="info">${cusErr
  ?'Não consegui ler a planilha de custos ('+esc(cusErr)+'). Confira se ela continua compartilhada como “qualquer pessoa com o link”.'

/* 1 ── Visão executiva */

      <tr><td>ROAS</td><td class="num"><b>${xN(M.roas)}</b></td></tr>

/* 2 ── Custos */
function pCustos(){
  const rows=cRows(), inv=rows.reduce((a,x)=>a+x.val,0);
  const bySrc={},byE={},byC={};

  <div class="card"><div class="ch"><h3>Por origem do custo</h3></div>

    <div class="lgd">${slices.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.k)} · ${moS(x.v)}</span>`).join('')}</div></div></div>

    ${hbar(Object.entries(byC).sort((a,b)=>b[1]-a[1]),inv,moS,'g')}</div>

    ${bars(s.map(([k,v])=>[k,v.inv]),'var(--orange)',170)}</div>`}

/* 7 ── Campanhas (tabela ordenável + detalhe) */
const CCOLS=[['camp','Campanha',o=>esc(o.k)],['emp','Empresa',o=>esc(empOf(o.k))],
  ['inv','Investimento',o=>mo(o.inv)],['leads','Leads',o=>n(o.leads)],['cpl','CPL',o=>fmtOr(o.cpl,mo)],
  ['nv','Vendas',o=>n(o.nv)],['cac','CAC',o=>fmtOr(o.cac,mo)],['fat','Faturamento',o=>mo(o.fat)],
  ['ticket','Ticket',o=>fmtOr(o.ticket,mo)],['roi','ROI',o=>pctN(o.roi)],['roas','ROAS',o=>xN(o.roas)],
  ['margem','Margem',o=>pctN(o.margem)]];
function pCamp(){
  const bc=byCamp();
  const list=Object.entries(bc).map(([k,o])=>Object.assign({k},o));
  const key=cSort.k, dir=cSort.d;
  list.sort((a,b)=>{
    if(key==='camp')return -dir*a.k.localeCompare(b.k,'pt-BR');
    if(key==='emp')return -dir*empOf(a.k).localeCompare(empOf(b.k),'pt-BR');
    const x=a[key],y=b[key];
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    return dir===-1?(y-x):(x-y)});
  const head=CCOLS.map(c=>`<th><button class="sortb" data-k="${c[0]}">${c[1]}${cSort.k===c[0]?(cSort.d===-1?' ↓':' ↑'):''}</button></th>`).join('');
  const body=list.map(o=>`<tr class="crow" data-c="${esc(o.k)}">${CCOLS.map(c=>`<td>${c[2](o)}</td>`).join('')}</tr>`).join('');
  const det=fCamp&&bc[fCamp]?campDetalhe(fCamp,bc[fCamp]):'';
  return `${det}
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Todas as campanhas</h3>
    <span class="m">${list.length} · toque no cabeçalho para ordenar</span></div>
    <div class="tw"><table><thead><tr>${head}</tr></thead>
    <tbody>${body||'<tr><td colspan="12">Sem dados no recorte.</td></tr>'}</tbody></table></div></div>`}
function campDetalhe(c,o){
  const du=diasUteis();
  const proj=du.feitos?o.fat/du.feitos*du.tot:null;
  const src=Object.entries(o.src||{}).map(([k,v])=>`${SRCLAB[k]||k} ${moS(v)}`).join(' · ')||'—';
  const s=perfSerie();
  return `<div class="card wide"><div class="ch"><h3>${esc(c)}</h3>
    <span class="m">${esc(empOf(c))} · ${isOff(c)?'offline':'online'}</span></div>
    <div class="kg" style="margin:0">
      ${kpi('Investimento',moS(o.inv),null,'','',0)}${kpi('Faturamento',moS(o.fat),null,'a','',1)}
      ${kpi('ROAS',xN(o.roas),null,'g','',2)}${kpi('ROI',pctN(o.roi),null,'g','',3)}
    </div>
    ${statRow([['Origem do custo',src],['Leads',n(o.leads)],['CPL',fmtOr(o.cpl,mo)],['Vendas',n(o.nv)],
      ['Conversão',pctN(o.conv)],['CAC',fmtOr(o.cac,mo)],['Ticket médio',fmtOr(o.ticket,mo)],
      ['Margem após mídia',pctN(o.margem)],['Custo sobre faturamento',pctN(o.mcusto)],
      ['Tempo médio para fechar',o.tempo==null?'—':dd1(o.tempo)+' d'],
      ['Faturamento projetado do mês',fmtOr(proj,moS),1]])}
    <div class="ch" style="padding:12px 0 2px"><h3>Evolução</h3><span class="m">${granLabel()}</span></div>
    ${duo(s.map(([k,v])=>[k,v.fat,v.inv]),'var(--green)','var(--orange)','Faturamento','Investimento')}
    <button class="lnk" id="limpaCamp">Limpar seleção de campanha</button></div>`}

/* 8 ── Semanal / dia da semana */
function pSem(){
  const rows=cRows();
  const wk={};
  const g=k=>wk[k]||(wk[k]={inv:0,leads:0,nv:0,fat:0});
  const sem=s=>{const d=parse(s),x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
  rows.forEach(x=>g(sem(x.d)).inv+=x.val);
  SERIE.forEach(([s,l])=>{if(inRange(s))g(sem(s)).leads+=l});
  fParc().forEach(x=>g(sem(finDate(x))).fat+=x.v);
  fSale().forEach(x=>g(sem(finDate(x))).nv++);
  const ord=Object.entries(wk).sort((a,b)=>a[0].localeCompare(b[0]));
  const calc=o=>({...o,cpl:o.inv>0?sdiv(o.inv,o.leads):null,cac:o.inv>0?sdiv(o.inv,o.nv):null,
    roi:o.inv>0?(o.fat-o.inv)/o.inv:null,roas:o.inv>0?sdiv(o.fat,o.inv):null,
    margem:(o.fat>0&&o.inv>0)?(o.fat-o.inv)/o.fat:null});
  const L=ord.map(([k,o])=>[k,calc(o)]);
  const tr=L.slice().reverse().map(([k,o],i,arr)=>{const pv=arr[i+1]?arr[i+1][1]:null;
    return `<tr><td>${brd(k)}</td><td>${mo(o.inv)} ${pv?deltaCell(o.inv,pv.inv,true):''}</td>
      <td>${n(o.leads)} ${pv?deltaCell(o.leads,pv.leads):''}</td>
      <td>${fmtOr(o.cpl,mo)} ${pv?deltaCell(o.cpl,pv.cpl,true):''}</td>
      <td>${n(o.nv)} ${pv?deltaCell(o.nv,pv.nv):''}</td><td>${fmtOr(o.cac,mo)}</td>
      <td>${mo(o.fat)} ${pv?deltaCell(o.fat,pv.fat):''}</td>
      <td>${pctN(o.roi)}</td><td>${xN(o.roas)}</td><td>${pctN(o.margem)}</td></tr>`}).join('');
  /* por dia da semana */
  const dw={};const gd=i=>dw[i]||(dw[i]={inv:0,leads:0,nv:0,fat:0});
  rows.forEach(x=>gd(parse(x.d).getDay()).inv+=x.val);
  SERIE.forEach(([s,l])=>{if(inRange(s))gd(parse(s).getDay()).leads+=l});
  fParc().forEach(x=>gd(parse(finDate(x)).getDay()).fat+=x.v);
  fSale().forEach(x=>gd(parse(finDate(x)).getDay()).nv++);
  const dws=[1,2,3,4,5,6,0].filter(i=>dw[i]).map(i=>[DOW[i],calc(dw[i])]);
  return `
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Semana a semana</h3>
    <span class="m">${L.length} semanas · variação vs anterior</span></div>
    <div class="tw"><table><thead><tr><th>Semana</th><th>Investimento</th><th>Leads</th><th>CPL</th><th>Vendas</th>
      <th>CAC</th><th>Faturamento</th><th>ROI</th><th>ROAS</th><th>Margem</th></tr></thead>
    <tbody>${tr||'<tr><td colspan="10">Sem dados.</td></tr>'}</tbody></table></div></div>
  <div class="card wide"><div class="ch"><h3>Leads por dia da semana</h3></div>
    ${hbar(dws.map(([k,o])=>[k,o.leads]),0,n,'')}</div>
  <div class="card"><div class="ch"><h3>CPL por dia da semana</h3></div>
    ${hbar(dws.filter(x=>x[1].cpl!=null).map(([k,o])=>[k,o.cpl]),0,mo,'g')}</div>
  <div class="card"><div class="ch"><h3>Faturamento por dia da semana</h3></div>
    ${hbar(dws.map(([k,o])=>[k,o.fat]),0,moS,'g')}</div>
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Detalhe por dia da semana</h3></div>
    <div class="tw"><table><thead><tr><th>Dia</th><th>Investimento</th><th>Leads</th><th>CPL</th><th>Vendas</th>
      <th>Conv.</th><th>CAC</th><th>Faturamento</th><th>ROI</th><th>ROAS</th></tr></thead>
    <tbody>${dws.map(([k,o])=>`<tr><td>${k}</td><td>${mo(o.inv)}</td><td>${n(o.leads)}</td><td>${fmtOr(o.cpl,mo)}</td>
      <td>${n(o.nv)}</td><td>${pctN(sdiv(o.nv,o.leads))}</td><td>${fmtOr(o.cac,mo)}</td><td>${mo(o.fat)}</td>
      <td>${pctN(o.roi)}</td><td>${xN(o.roas)}</td></tr>`).join('')||'<tr><td colspan="10">Sem dados.</td></tr>'}</tbody></table></div></div>`}

/* 9 ── Projeções e pacing */
function pProj(){
  const M=metPeriodo(),du=diasUteis();
  const mdFat=sdiv(M.fat,du.feitos), mdInv=sdiv(M.inv,du.feitos);
  const projFat=mdFat==null?null:mdFat*du.tot, projInv=mdInv==null?null:mdInv*du.tot;
  /* orçamento diário informado no Google Ads */
  const bud={};cRows().forEach(x=>{if(x.budget)bud[x.camp]=x.budget});
  const budDia=Object.values(bud).reduce((a,b)=>a+b,0);
  const plan=budDia*du.tot;
  const pctMes=du.tot?du.feitos/du.tot:0;
  const dif=plan?M.inv-plan*pctMes:null;
  const neces=du.rest&&plan?Math.max(0,(plan-M.inv)/du.rest):null;
  return `
  <div class="kg">
    ${kpi('Faturamento projetado',fmtOr(projFat,moS),null,'g','',0,`base: ${du.feitos} de ${du.tot} dias úteis`)}
    ${kpi('Investimento projetado',fmtOr(projInv,moS),null,'','',1)}
    ${kpi('Dias úteis trabalhados',du.feitos,null,'a','',2)}
    ${kpi('Dias úteis restantes',du.rest,null,'','',3)}
  </div>
  <div class="card"><div class="ch"><h3>Projeção de faturamento</h3></div>
    ${statRow([['Faturamento realizado',moS(M.fat)],['Média por dia útil',fmtOr(mdFat,mo)],
      ['Dias úteis do mês',n(du.tot)],['Projeção de fechamento',fmtOr(projFat,moS),1],
      ['Falta para a projeção',projFat==null?'—':moS(Math.max(0,projFat-M.fat))]])}</div>
  <div class="card"><div class="ch"><h3>Projeção de investimento</h3></div>
    ${statRow([['Investimento realizado',moS(M.inv)],['Média por dia útil',fmtOr(mdInv,mo)],
      ['Investimento projetado',fmtOr(projInv,moS),1],
      ['Restante previsto',projInv==null?'—':moS(Math.max(0,projInv-M.inv))],
      ['% do projetado utilizado',projInv?dd1(M.inv/projInv*100)+'%':'—']])}</div>

function estrutura(){
  const bc=byCamp(), k=Object.keys(bc);
  const on=k.filter(c=>!isOff(c)).length, off=k.length-on;
  const inv=Object.values(bc).reduce((a,o)=>a+o.inv,0);
  const fat=Object.values(bc).reduce((a,o)=>a+o.fat,0);
  const lds=Object.values(bc).reduce((a,o)=>a+o.leads,0);
  const nv=Object.values(bc).reduce((a,o)=>a+o.nv,0);
  const est={};ATIVAS.forEach(r=>{const s=String(r[0]||'').trim()||'—';est[s]=(est[s]||0)+1});
  const emps=new Set(Object.keys(byEmp()));
  const adsEst={};cRows().forEach(x=>{if(x.estado)adsEst[x.estado]=1});
  return statRow([['Campanhas com movimento no período',n(k.length),1],
    ['Online',n(on)],['Offline',n(off)],
    ['Empresas envolvidas',n(emps.size)],
    ['Investimento médio por campanha',k.length?mo(inv/k.length):'—'],
    ['Leads médios por campanha',k.length?n(Math.round(lds/k.length)):'—'],
    ['Vendas médias por campanha',k.length?dd1(nv/k.length):'—'],
    ['Faturamento médio por campanha',k.length?mo(fat/k.length):'—'],

const CRCT=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();

const enc=s=>new TextEncoder().encode(s);
function zip(files){
  const parts=[],cd=[];let off=0;
  const w16=(a,v)=>{a.push(v&255,(v>>8)&255)}, w32=(a,v)=>{a.push(v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255)};
  files.forEach(f=>{
    const name=enc(f.n), data=f.d, c=crc32(data), h=[];
    w32(h,0x04034b50);w16(h,20);w16(h,0);w16(h,0);w16(h,0);w16(h,0);
    w32(h,c);w32(h,data.length);w32(h,data.length);w16(h,name.length);w16(h,0);
    parts.push(new Uint8Array(h),name,data);
    const e=[];w32(e,0x02014b50);w16(e,20);w16(e,20);w16(e,0);w16(e,0);w16(e,0);w16(e,0);
    w32(e,c);w32(e,data.length);w32(e,data.length);w16(e,name.length);
    w16(e,0);w16(e,0);w16(e,0);w16(e,0);w32(e,0);w32(e,off);
    cd.push(new Uint8Array(e),name);
    off+=30+name.length+data.length});
  const cdSize=cd.reduce((a,x)=>a+x.length,0), end=[];
  w32(end,0x06054b50);w16(end,0);w16(end,0);w16(end,files.length);w16(end,files.length);
  w32(end,cdSize);w32(end,off);w16(end,0);
  const all=[...parts,...cd,new Uint8Array(end)];
  const tot=all.reduce((a,x)=>a+x.length,0), out=new Uint8Array(tot);let p=0;
  all.forEach(x=>{out.set(x,p);p+=x.length});
  return out}

const dsOkC=x=>(fE==='TODAS'||x.emp===fE)&&(!fCamp||x.camp===fCamp)&&onOk(x.camp);
const dsOkL=c=>!c||((fE==='TODAS'||empOf(c)===fE)&&(!fCamp||c===fCamp)&&onOk(c));
const dsOkF=x=>finOk(x)&&onOk(x.mi);

/* soma custo, leads, vendas e faturamento de [a,b] agrupando por chave */
function dsAgg(a,b,key){
  const m={}, g=k=>m[k]||(m[k]={inv:0,leads:0,nv:0,fat:0,tot:0,dsum:0,dn:0,velho:0,src:{}});
  const dentro=s=>!!s&&s>=a&&s<=b;
  CUSTO.forEach(x=>{if(!dentro(x.d)||!dsOkC(x))return;const o=g(key.c(x));o.inv+=x.val;o.src[x.src]=(o.src[x.src]||0)+x.val});
  SER.forEach(r=>{if(!dentro(r[0])||!dsOkL(r[1]))return;g(key.l(r)).leads+=r[3]});
  FIN.forEach(x=>{const d=finDate(x);if(!dentro(d)||!dsOkF(x))return;g(key.f(x)).fat+=x.v});
  SALES.forEach(x=>{const d=finDate(x);if(!dentro(d)||!dsOkF(x))return;const o=g(key.f(x));
    o.nv++;o.tot+=x.tot;if(!(x.ld&&x.ld>=a&&x.ld<=b))o.velho++;
    const t=ddiff(x.ld,x.vc);if(t!=null&&t>=0){o.dsum+=t;o.dn++}});
  Object.values(m).forEach(dsDeriva);
  return m}
function dsDeriva(o){
  o.cpl=(o.inv>0&&o.leads>0)?o.inv/o.leads:null; o.cac=(o.inv>0&&o.nv>0)?o.inv/o.nv:null;
  o.conv=o.leads>0?o.nv/o.leads:null; o.lf=o.nv>0?o.leads/o.nv:null;
  o.ticket=o.nv>0?o.tot/o.nv:null; o.lucro=o.fat-o.inv;
  o.roi=o.inv>0?(o.fat-o.inv)/o.inv:null; o.roas=o.inv>0?o.fat/o.inv:null;
  o.margem=(o.fat>0&&o.inv>0)?(o.fat-o.inv)/o.fat:null; o.icr=(o.fat>0&&o.inv>0)?o.inv/o.fat:null;
  o.tempo=o.dn?o.dsum/o.dn:null; return o}
const K_CAMP={c:x=>x.camp,l:r=>r[1]||BL,f:x=>x.mi};
const K_EMP ={c:x=>x.emp, l:r=>empOf(r[1]),f:x=>x.e};
const K_TOT ={c:()=>'T',l:()=>'T',f:()=>'T'};
const dsTot=(a,b)=>dsAgg(a,b,K_TOT).T||dsDeriva({inv:0,leads:0,nv:0,fat:0,tot:0,dsum:0,dn:0,velho:0,src:{}});
function dsDias(a,b){const s=new Set();SER.forEach(r=>{if(r[0]>=a&&r[0]<=b&&r[3]>0&&dsOkL(r[1]))s.add(r[0])});return s.size}

/* variação relativa; null quando não há base */
const vr=(c,p)=>(c==null||p==null||!isFinite(c)||!isFinite(p)||p===0)?null:(c-p)/Math.abs(p);
const sinal=v=>v==null?'—':(v>0?'+':'')+dd1(v*100)+'%';
/* seta colorida: bom=up (true) ou bom=down (false) ou neutro (null) */
function seta(v,bomSobe){
  if(v==null)return `<span class="vv n">—</span>`;
  if(Math.abs(v)<0.005)return `<span class="vv n">= 0%</span>`;
  const up=v>0, cls=bomSobe==null?'n':((up===bomSobe)?'g':'r');
  return `<span class="vv ${cls}">${up?'▲':'▼'} ${dd1(Math.abs(v)*100)}%</span>`}
/* faixas fixas para colorir como na planilha */
const FX={margem:v=>{const f=CFG.faixas;return v==null?'':v>=f.margemBoa/100?'g':v>=f.margemOk/100?'y':'r'},
  icr:v=>{const f=CFG.faixas;return v==null?'':v<=f.icrBom/100?'g':v<=f.icrOk/100?'y':'r'},
  roi:v=>{const f=CFG.faixas;return v==null?'':v>=f.roiBom/100?'g':v>=0?'y':'r'},
  roas:v=>{const f=CFG.faixas;return v==null?'':v>=f.roasBom?'g':v>=f.roasOk?'y':'r'}};

function dsDados(){
  const a=d1,b=d2,[pa,pb]=prevRange();
  const T=dsTot(a,b), P=dsTot(pa,pb);
  const C=dsAgg(a,b,K_CAMP), CP=dsAgg(pa,pb,K_CAMP);
  const E=fE==='TODAS'?dsAgg(a,b,K_EMP):null;
  const dias=dsDias(a,b)||1;
  return{a,b,pa,pb,T,P,C,CP,E,dias}}

/* ───── textos automáticos ───── */
function dsNarrativa(D){
  const T=D.T,P=D.P,L=[];
  const cmp=(c,p,inv)=>{const v=vr(c,p);return v==null?'':` (${sinal(v)} vs período anterior)`};
  L.push(`Investimento em mídia de ${mo(T.inv)}${cmp(T.inv,P.inv)}.`);
  L.push(`${n(T.leads)} leads gerados${cmp(T.leads,P.leads)}${T.cpl!=null?`, com CPL de ${mo2(T.cpl)}`:''}.`);
  L.push(`${n(T.nv)} vendas${cmp(T.nv,P.nv)}${T.conv!=null?`, conversão de ${pctN(T.conv)}`:''}${T.cac!=null?` e CAC de ${mo2(T.cac)}`:''}.`);
  L.push(`Faturamento de ${mo(T.fat)}${cmp(T.fat,P.fat)}${T.ticket!=null?`, ticket médio de ${mo2(T.ticket)}`:''}${T.roas!=null?` e ROAS de ${xN(T.roas)}`:''}.`);
  if(T.inv>0)L.push(`Lucro após mídia de ${mo(T.lucro)}${T.margem!=null?` (margem de ${pctN(T.margem)})`:''}.`);
  if(T.nv>0)L.push(`${n(T.nv-T.velho)} vendas vieram de leads que entraram no período e ${n(T.velho)} de leads anteriores (base antiga).`);
  const camps=Object.entries(D.C).filter(([k,o])=>k!=='NÃO MAPEADA');
  const best=camps.filter(x=>x[1].roas!=null&&x[1].nv>0).sort((x,y)=>y[1].roas-x[1].roas)[0];
  const cplAlto=camps.filter(x=>x[1].cpl!=null).sort((x,y)=>y[1].cpl-x[1].cpl)[0];
  if(best)L.push(`Melhor ROAS: ${curto(best[0])} (${xN(best[1].roas)}).`+(cplAlto?` Maior CPL: ${curto(cplAlto[0])} (${mo2(cplAlto[1].cpl)}).`:''));
  const pj=dsProjecao(D);
  if(pj)L.push(`Projeção de fechamento do mês: ${mo(pj.fat)} de faturamento e ${mo(pj.inv)} de investimento (${pj.feitos} de ${pj.tot} dias úteis).`);
  return L}
const mo2=v=>v==null?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
function dsProjecao(D){
  const h=iso(hoje); if(!(D.a<=h&&D.b>=h))return null;
  if(D.a.slice(0,7)!==D.b.slice(0,7))return null;
  const du=diasUteis(); if(du.feitos<3)return null;   /* com menos de 3 dias úteis a projeção ainda é instável */
  return{fat:D.T.fat/du.feitos*du.tot,inv:D.T.inv/du.feitos*du.tot,feitos:du.feitos,tot:du.tot}}

function dsAlertas(D){
  const A=[],B=[];
  Object.entries(D.C).forEach(([k,o])=>{
    const p=D.CP[k]||{},nm=curto(k);
    if(k==='NÃO MAPEADA'){if(o.inv>0)A.push(['y',`${mo(o.inv)} de custo Meta sem campanha mapeada (coluna L vazia na planilha de custos).`]);return}
    if(o.inv>0&&o.nv===0)A.push(['r',`${nm} investiu ${mo(o.inv)} e não teve vendas no período.`]);
    else if(o.roas!=null&&o.roas<1)A.push(['r',`${nm} faturou menos do que investiu (ROAS ${xN(o.roas)}).`]);
    const vc=vr(o.cpl,p.cpl); if(vc!=null&&vc>.2)A.push(['y',`CPL de ${nm} subiu ${dd1(vc*100)}% (${mo2(p.cpl)} → ${mo2(o.cpl)}).`]);
    const vl=vr(o.leads,p.leads); if(vl!=null&&vl<-.2&&(p.leads||0)>=30)A.push(['y',`Leads de ${nm} caíram ${dd1(-vl*100)}% (${n(p.leads)} → ${n(o.leads)}).`]);
    if(o.fat>0&&o.leads===0&&o.inv===0)A.push(['n',`${nm} tem ${mo(o.fat)} de faturamento sem leads nem custo na base (ex.: indicação).`]);
  });
  const L=Object.entries(D.C).filter(([k])=>k!=='NÃO MAPEADA');
  const top=(f,s)=>L.filter(x=>f(x[1])!=null&&(x[1].nv>0||x[1].leads>0)).sort((x,y)=>s*(f(y[1])-f(x[1])))[0];
  const r=top(o=>o.roas,1),c=top(o=>o.cpl,-1),v=top(o=>o.nv,1),f=top(o=>o.fat,1);
  if(r)B.push(`Maior ROAS: <b>${esc(curto(r[0]))}</b> · ${xN(r[1].roas)}`);
  if(c)B.push(`Menor CPL: <b>${esc(curto(c[0]))}</b> · ${mo2(c[1].cpl)}`);
  if(v)B.push(`Mais vendas: <b>${esc(curto(v[0]))}</b> · ${n(v[1].nv)}`);
  if(f)B.push(`Maior faturamento: <b>${esc(curto(f[0]))}</b> · ${mo(f[1].fat)}`);
  return{A,B}}

/* ───── tabelas de apoio ───── */
function dsMidia(D){
  const L=Object.entries(D.C).filter(([k,o])=>o.leads>0||o.inv>0||o.nv>0||o.fat>0)
    .sort((x,y)=>y[1].leads-x[1].leads||y[1].fat-x[1].fat);
  return L.map(([k,o])=>({k,nome:curto(k),o,p:D.CP[k]||null}))}
function dsSemanas(a,b){
  const out=[];let ini=parse(a);const fim=parse(b);let i=1;
  while(ini<=fim&&i<=14){
    const f=new Date(ini);f.setDate(f.getDate()+6);
    const wa=iso(ini),wb=iso(f>fim?fim:f);
    const o=dsTot(wa,wb);o.n='Semana '+i;o.ini=wa;o.fim=wb;o.parcial=f>fim||wb>=iso(hoje);
    out.push(o);ini=new Date(f);ini.setDate(ini.getDate()+1);i++}
  out.forEach((w,k)=>{const p=out[k-1];
    w.vL=p?vr(w.leads,p.leads):null;w.vF=p?vr(w.fat,p.fat):null;w.vR=p?vr(w.roas,p.roas):null;
    w.st=k===0?'BASE':(w.leads===0&&w.nv===0&&w.inv===0)?'SEM DADOS':w.parcial?'PARCIAL'
      :(w.vR==null?'ESTÁVEL':w.vR>.1?'ALTA':w.vR<-.1?'QUEDA':'ESTÁVEL')});
  return out}
function dsTab(a,b){
  const m={},col={},row={};let tot=0;
  SER.forEach(r=>{if(r[0]<a||r[0]>b||!dsOkL(r[1]))return;
    const c=r[1]||BL,t=(r[2]&&r[2]!=='-')?r[2]:'Sem tabulação';
    m[t+'|'+c]=(m[t+'|'+c]||0)+r[3];col[c]=(col[c]||0)+r[3];row[t]=(row[t]||0)+r[3];tot+=r[3]});
  const camps=Object.keys(col).sort((x,y)=>col[y]-col[x]);
  const ORD=['Venda','Pré - Venda','Pré-Venda','Negociando','Fechado','1 Habilitação','Discador','Não atende','Desqualificado','Sem tabulação'];
  const tabs=Object.keys(row).sort((x,y)=>{const i=ORD.indexOf(x),j=ORD.indexOf(y);
    return (i<0?99:i)-(j<0?99:j)||row[y]-row[x]});
  return{camps,tabs,col,row,tot,get:(t,c)=>m[t+'|'+c]||0}}
function dsVendas(a,b){
  return SALES.filter(x=>{const d=finDate(x);return d&&d>=a&&d<=b&&dsOkF(x)})
    .sort((x,y)=>finDate(y).localeCompare(finDate(x)))}
function dsGrupo(lista,f){const m={};
  lista.forEach(x=>{const k=f(x)||'—',o=m[k]||(m[k]={nv:0,tot:0,dsum:0,dn:0});o.nv++;o.tot+=x.tot;
    const t=ddiff(x.ld,x.vc);if(t!=null&&t>=0){o.dsum+=t;o.dn++}});
  return Object.entries(m).sort((x,y)=>y[1].tot-x[1].tot)}
function dsFatPorServ(a,b){const m={};
  FIN.forEach(x=>{const d=finDate(x);if(!d||d<a||d>b||!dsOkF(x))return;m[x.sv]=(m[x.sv]||0)+x.v});return m}

function dsTexto(){
  const D=dsDados();

async function dsCopiar(){
  const t=dsTexto();
  try{await navigator.clipboard.writeText(t);aviso('Resumo copiado')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');aviso('Resumo copiado')}catch(_){aviso('Não consegui copiar')}a.remove()}}
function aviso(t){let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}
function dsPDF(){
  document.body.classList.add('print-rel');
  const fim=()=>{document.body.classList.remove('print-rel');removeEventListener('afterprint',fim)};
  addEventListener('afterprint',fim);
  const t=document.title;document.title=`Relatorio ${empNome()} ${dc(d1)} a ${dc(d2)}`.replace(/\//g,'-');
  setTimeout(()=>{window.print();document.title=t;setTimeout(fim,1500)},120)}

async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function admEntrar(u,s){
  const h=await sha256(String(u||'').trim().toLowerCase()+':'+String(s||''));
  if(h!==ADM_HASH){logEv('Administração','tentativa de login',false,0,0,'usuário ou senha inválidos');return false}
  try{sessionStorage.setItem('gwa.adm',JSON.stringify({ate:Date.now()+8*3600e3}))}catch(e){}
  logEv('Administração','login',true,0,0,'sessão de 8 horas');return true}

function inDiario(a,b){
  const lim=iso(hoje), fim=b>lim?lim:b, m={}, g=k=>m[k]||(m[k]={inv:0,leads:0,nv:0,fat:0});
  CUSTO.forEach(x=>{if(x.d>=a&&x.d<=fim&&dsOkC(x))g(x.d).inv+=x.val});

  FIN.forEach(x=>{const d=finDate(x);if(d&&d>=a&&d<=fim&&dsOkF(x))g(d).fat+=x.v});
  SALES.forEach(x=>{const d=finDate(x);if(d&&d>=a&&d<=fim&&dsOkF(x))g(d).nv++});
  const out=[];for(let d=parse(a);iso(d)<=fim;d.setDate(d.getDate()+1)){const k=iso(d);out.push([k,m[k]||{inv:0,leads:0,nv:0,fat:0}])}
  return out}
/* sparkline em área, escala própria */
function sparkA(vals,cor,w,h){
  w=w||160;h=h||44;if(vals.length<2)return '';

  const X=i=>(i/(N-1)*w),Y=v=>h-2-(v/mx)*(h-6);
  const ln=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const id='s'+Math.random().toString(36).slice(2,7);
  return `<svg class="spa" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cor}" stop-opacity=".28"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs>
    <path d="${ln} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/>
    <path d="${ln}" fill="none" stroke="${cor}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`}

function roasPill(v){if(v==null)return '<span class="rp0">—</span>';const k=FX.roas(v);return `<span class="rpx ${k}">${xN(v)}</span>`}

/* ═════ BM (Business Manager) — atribuição a partir dos dados reais ═════
   Custo: cada conta de anúncio pertence a um único BM. O BM sai do nome da conta ("Grazi - BM3"),
          do mapa do admin, ou das campanhas da conta que citam o BM ("… BM1 SET26").
   Lead:  1) nome do formulário igual ao nome de uma campanha Meta → BM da conta dessa campanha;
          2) linha de WhatsApp (4 últimos dígitos do CANAL, ou citada no formulário) que aparece no nome
             de campanhas Meta do mesmo mês → BM dessas campanhas (se a linha rodou em mais de um BM
             naquele mês, o lead é dividido pelo gasto de cada BM na linha);
          3) linha cadastrada à mão no admin;  4) sem vínculo (Google, VOIP, TV, linhas sem campanha…).
   Venda: chave do card do faturamento → lead → BM do lead. */
const SEMBM='SEM VÍNCULO';
const normT=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const RX_LIN=/(?:WHATSAPP|WAPP|WPP|ZAP)\s*(\d{4})(?!\d)/g;
const mesTxt=v=>{const m=String(v==null?'':v).trim().match(/^(\d{1,2})\s*\/\s*(\d{4})$/);return m?m[1].padStart(2,'0')+'/'+m[2]:''};
const mesIso=d=>d?d.slice(5,7)+'/'+d.slice(0,4):'';
function bmMotor(meta){
  const man=CFG.bmContas||{},acc={},votos={};
  (meta||[]).forEach(r=>{const a=String(r[6]==null?'':r[6]).trim();if(!a||acc[a])return;
    if(man[a]){acc[a]=man[a];return}
    const m=a.match(/\bBM\s*(\d+)\b/i);if(m){acc[a]='BM'+m[1];return}
    const c=String(r[7]||'').match(/\bBM\s*(\d+)\b/i);if(c)(votos[a]=votos[a]||{})['BM'+c[1]]=1});
  Object.entries(votos).forEach(([a,o])=>{const k=Object.keys(o);if(!acc[a]&&k.length===1)acc[a]=k[0]});
  const camp={},cv={},linha={},contas={};
  (meta||[]).forEach(r=>{const a=String(r[6]==null?'':r[6]).trim(),v=+r[1]||0,mes=mesTxt(r[0]);if(!a)return;
    const bm=acc[a]||'';const o=contas[a]||(contas[a]={bm,v:0});o.v+=v;
    if(!bm||!v||!mes)return;
    const nm=normT(r[7]);if(nm&&(!cv[nm]||v>cv[nm])){camp[nm]=bm;cv[nm]=v}
    for(const x of String(r[7]||'').toUpperCase().matchAll(RX_LIN)){const k=mes+'|'+x[1];const q=linha[k]||(linha[k]={});q[bm]=(q[bm]||0)+v}});
  return{acc,camp,linha,contas}}
function bmLead(M,form,canal,mes){
  const f=normT(form);if(f&&M.camp[f])return[[M.camp[f],1,'form']];
  const ls=[];for(const x of f.matchAll(RX_LIN))ls.push(x[1]);
  const d=String(canal==null?'':canal).replace(/\D/g,'');if(d.length>=8)ls.push(d.slice(-4));
  for(const l of ls){const s=M.linha[mes+'|'+l];if(!s)continue;const e=Object.entries(s),t=e.reduce((q,[,v])=>q+v,0);
    return e.map(([b,v])=>[b,v/t,e.length>1?'rateio':'linha'])}
  for(const l of ls){const b=(CFG.bmLinhas||{})[l];if(b)return[[b,1,'manual']]}
  return[[SEMBM,1,'sem']]}
/* consolida leads, vendas, faturamento e custo por BM da empresa fE no período a..b */
function bmCalc(M,leads,velhos,a,b){
  const R={},how={form:0,linha:0,rateio:0,manual:0,sem:0},linSem={};
  const g=k=>R[k]||(R[k]={bm:k,inv:0,leads:0,nv:0,fat:0});
  const card=new Map();
  leads.forEach(x=>card.set(x.ck,x));(velhos||[]).forEach(x=>{if(!card.has(x.ck))card.set(x.ck,x)});
  const atr=x=>x._bm||(x._bm=bmLead(M,x.form,x.canal,mesIso(x.d)));
  leads.forEach(x=>{if(x.d<a||x.d>b)return;atr(x).forEach(([k,w,h])=>{g(k).leads+=w;how[h]+=w;
    if(h==='sem'){const d=String(x.canal||'').replace(/\D/g,'');const l=d.length>=8?d.slice(-4):'(sem linha)';linSem[l]=(linSem[l]||0)+w}})});
  let semLead=0;
  const vend=SALES.filter(x=>finOk(x)&&x.e===fE&&finDate(x)&&finDate(x)>=a&&finDate(x)<=b);
  const qual=new Map();
  vend.forEach(s=>{const l=s.ck&&card.get(s.ck);const at=l?atr(l):[[SEMBM,1,'sem']];if(!l)semLead++;qual.set(s.id,at);at.forEach(([k,w])=>g(k).nv+=w)});
  FIN.forEach(p=>{if(!finOk(p)||p.e!==fE)return;const d=finDate(p);if(!d||d<a||d>b)return;
    let at=qual.get(p.id);if(!at){const l=p.ck&&card.get(p.ck);at=l?atr(l):[[SEMBM,1,'sem']]}
    at.forEach(([k,w])=>g(k).fat+=p.v*w)});
  let invSem=0;
  CUSTO.forEach(x=>{if(x.src!=='META'||x.emp!==fE||x.d<a||x.d>b)return;const k=M.acc[x.conta];if(k)g(k).inv+=x.val;else invSem+=x.val});
  const sem=R[SEMBM]||{bm:SEMBM,inv:0,leads:0,nv:0,fat:0};delete R[SEMBM];sem.inv=invSem;
  const lista=Object.values(R).filter(x=>x.inv>0||x.leads>=1||x.nv>0).sort((x,y)=>y.inv-x.inv||y.leads-x.leads);
  lista.forEach(x=>{const c=x.inv>0;x.cpl=c&&x.leads?x.inv/x.leads:null;x.cpa=c&&x.nv?x.inv/x.nv:null;x.roas=c?x.fat/x.inv:null;x.margem=c&&x.fat?(x.fat-x.inv)/x.fat:null});
  return{lista,sem,how,linSem,semLead,nVend:vend.length}}

/* ── BM: contas de anúncio e linhas de WhatsApp ── */
function aBM(){
  const M=bmMotor(RAW.meta||[]);
