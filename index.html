<style>
:root{
  --gold:#F8C000; --orange:#EA742E;
  --bg:#FAF8F5; --bg2:#F1ECE5; --card:#FFFFFF;
  --ink:#16130F; --ink2:#6B6257; --ink3:#9C9284;
  --line:rgba(22,19,15,.10); --line2:rgba(22,19,15,.055);
  --accent:#E8711F; --accent-s:rgba(232,113,31,.12); --accent-d:#C25A14;
  --green:#1B8F57; --green-s:rgba(27,143,87,.13);
  --blue:#2A6F97; --blue-s:rgba(42,111,151,.13);
  --slate:#64758A; --slate-s:rgba(100,117,138,.13);
  --rose:#BE3B2C; --rose-s:rgba(190,59,44,.12);
  --chrome:rgba(250,248,245,.82);
  --sh1:0 1px 2px rgba(22,19,15,.05);
  --sh2:0 1px 3px rgba(22,19,15,.06),0 10px 28px -12px rgba(22,19,15,.16);
  --e:cubic-bezier(.23,1,.32,1); --es:cubic-bezier(.32,.72,0,1);
  --r:16px; --nav:70px;
}
@media (prefers-color-scheme:dark){:root:not([data-t="light"]){
  --bg:#0F0D0C; --bg2:#191614; --card:#1B1917;
  --ink:#F5F1EA; --ink2:#A79D8F; --ink3:#776E62;
  --line:rgba(255,250,240,.11); --line2:rgba(255,250,240,.06);
  --accent:#F79A52; --accent-s:rgba(247,154,82,.16); --accent-d:#FBB574;
  --green:#4FC98D; --green-s:rgba(79,201,141,.16);
  --blue:#78B9E0; --blue-s:rgba(120,185,224,.16);
  --slate:#93A7BA; --slate-s:rgba(147,167,186,.16);
  --rose:#E7796A; --rose-s:rgba(231,121,106,.16);
  --chrome:rgba(15,13,12,.82);
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 3px rgba(0,0,0,.5),0 14px 34px -14px rgba(0,0,0,.75);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.024em;line-height:1.14}
p{margin:0}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:50;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-transparency:reduce){.top{background:var(--bg);backdrop-filter:none}}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
@media(min-width:760px){.wrap{padding-inline:24px}}
.tbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.plate{background:#fff;border-radius:9px;padding:5px 8px;display:inline-flex;box-shadow:var(--sh1);flex:none}
.plate img{height:28px;display:block}
.sp{flex:1}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:var(--green);animation:pul 2.4s var(--e) infinite}
.dot.off{background:var(--orange)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
.ico{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh1);flex:none;
  transition:transform .14s var(--e),background .2s}
.ico:active{transform:scale(.94)}
.ico svg{width:17px;height:17px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.spin svg{animation:sp 900ms linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── filtros ── */
.fbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.fbar::-webkit-scrollbar{display:none}
@media(max-width:759px){.fbar{margin-inline:-16px;padding-inline:16px}}
@media(min-width:760px){.fbar{flex-wrap:wrap;overflow:visible;row-gap:8px}}
.chips{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px;flex:none}
.chips button{font-size:12.5px;font-weight:500;color:var(--ink2);background:none;border:0;border-radius:9px;
  padding:7px 13px;cursor:pointer;white-space:nowrap;transition:color .18s,background .22s var(--e),transform .14s var(--e)}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
.chips.b button[aria-pressed=true]{background:linear-gradient(120deg,var(--gold),var(--orange));color:#fff}
select{font-size:12.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:12px;
  padding:8px 28px 8px 12px;cursor:pointer;flex:none;max-width:160px;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%239C9284' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
input[type=date]{font-size:12.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);
  border-radius:12px;padding:8px 10px;flex:none}

/* ── views ── */
main{padding-top:14px}
.view{display:none}
.view.on{display:block;animation:vin .32s var(--e) both}
@media(min-width:900px){
  .view.on{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .view.on>.h,.view.on>.kg,.view.on>.warn,.view.on>.card.wide{grid-column:1/-1}
  .view.on>.card{margin-bottom:0}
  .view.on>.kg{margin-bottom:0}
}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h{margin:2px 0 12px}
.h h2{font-size:21px}
.h p{font-size:13.5px;color:var(--ink2);margin-top:3px}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);
  padding:15px 16px;margin-bottom:12px;animation:rise .45s var(--e) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.t{padding:0;overflow:hidden}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.ch h3{font-size:14.5px}
.ch .m{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:500}

/* kpi grid */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:760px){.kg{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--sh1);position:relative;overflow:hidden;animation:rise .45s var(--e) both}
.k .kl{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.055em}
.k .kv{font-size:26px;font-weight:650;letter-spacing:-.035em;margin-top:5px;line-height:1}
.k .kd{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:4px;font-weight:500}
.k .kd.up{color:var(--green)} .k .kd.dn{color:var(--rose)} .k .kd.flat{color:var(--ink3)}
.k.g .kv{color:var(--green)} .k.b .kv{color:var(--blue)} .k.a .kv{color:var(--accent)}
.k .spk{position:absolute;right:0;bottom:0;width:62px;height:26px;opacity:.5}
.arw{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.arw.u{border-bottom:6px solid currentColor} .arw.d{border-top:6px solid currentColor}

/* listas */
.row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;padding:10px 4px;
  border-radius:11px;background:none;border:0;width:100%;text-align:left;cursor:pointer;
  transition:background .18s,transform .14s var(--e);animation:rise .4s var(--e) both}
.row:active{transform:scale(.994)}
@media(hover:hover){.row:hover{background:var(--bg2)}}
.row[aria-pressed=true]{background:var(--accent-s)}
.rn{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0}
.rn>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{font-size:14px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:baseline;gap:6px}
.rv small{font-size:11px;color:var(--ink3);font-weight:500}
.mt{grid-column:1/-1;height:4px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:1px}
.mt i{display:block;height:100%;border-radius:99px;transform-origin:left;
  background:linear-gradient(90deg,var(--gold),var(--orange));animation:gw .75s var(--es) both}
@keyframes gw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.mt.g i{background:var(--green)} .mt.b i{background:var(--blue)}
.mt.s i{background:var(--slate)} .mt.r i{background:var(--rose)}
.tg{font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;flex:none;white-space:nowrap}
.tg.g{background:var(--green-s);color:var(--green)} .tg.b{background:var(--blue-s);color:var(--blue)}
.tg.o{background:var(--accent-s);color:var(--accent-d)} .tg.s{background:var(--slate-s);color:var(--slate)}
.tg.r{background:var(--rose-s);color:var(--rose)}
.dl{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap}
.dl.up{background:var(--green-s);color:var(--green)} .dl.dn{background:var(--rose-s);color:var(--rose)}
.dl.flat{background:var(--slate-s);color:var(--slate)}

/* charts */
.cw{width:100%;overflow:hidden;animation:rev .85s var(--es) both}
@keyframes rev{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line2);stroke-width:1}
.ax{font-size:9.5px;fill:var(--ink3)}
.bar{transform-origin:bottom;animation:bg .6s var(--es) both}
@keyframes bg{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.arc{transition:stroke-dashoffset .9s var(--es)}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--ink2)}
.dw{display:flex;flex-direction:column;align-items:center}
@media(min-width:620px){.dw{flex-direction:row;gap:24px;align-items:center;justify-content:center}
  .dw .lgd{flex-direction:column;gap:9px;margin-top:0;flex-wrap:nowrap}}
.lgd i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* tabela */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:320px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
@media(max-width:520px){th,td{padding:9px 8px;font-size:12px}}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
thead th{font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--line)}
tbody td{border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;color:var(--ink2)}
tbody td:first-child{color:var(--ink);font-weight:500}
tbody tr:last-child td{border-bottom:0}
tbody td b{color:var(--ink);font-weight:650}
td.z{opacity:.35}

/* aviso */
.warn{display:flex;gap:10px;background:var(--accent-s);border:1px solid rgba(232,113,31,.3);
  border-radius:13px;padding:11px 13px;font-size:12.5px;margin-bottom:12px}
.warn b{font-weight:650}
.warn code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px}
@media (prefers-color-scheme:dark){:root:not([data-t=light]) .warn code{background:rgba(255,255,255,.1)}}
.info{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px}

/* nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--chrome);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-transparency:reduce){.nav{background:var(--bg);backdrop-filter:none}}
.nav ul{display:flex;max-width:640px;margin:0 auto;padding:0;list-style:none}
.nav li{flex:1}
.nav button{width:100%;height:var(--nav);background:none;border:0;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);
  transition:color .2s,transform .14s var(--e)}
.nav button:active{transform:scale(.93)}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav span{font-size:10px;font-weight:600;letter-spacing:-.01em}
.nav button[aria-current=true]{color:var(--accent)}
.nav button[aria-current=true] svg{stroke-width:2.3}
@media(min-width:760px){
  body{padding-bottom:40px}
  .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line2);order:-1}
  .nav ul{max-width:1160px;padding-inline:24px}
  .nav li{flex:none}
  .nav button{height:52px;flex-direction:row;gap:8px;padding-inline:16px}
  .nav span{font-size:13px}
  .nav svg{width:17px;height:17px}
}
</style></head><body>

/* gviz devolve data como "Date(aaaa,m,d)" com mes 0-indexado */
function gdate(v){
  if(v==null)return null;
  if(v instanceof Date)return isNaN(v)?null:iso(v);
  const s=String(v).trim();
  let m=s.match(/^Date\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(m)return m[1]+'-'+String(+m[2]+1).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
  return null}

function empOf(c){const s=String(c||'').trim();if(!s)return'—';

  if(/^pr[eé]\s*-?\s*venda/.test(s))return'o';
  if(/^venda/.test(s))return'g';

  if(/desqualific|n[ãa]o atende/.test(s))return'r';
  return's'}

function gviz(q,ms=25000){return new Promise((res,rej)=>{
  const cb='__g'+Math.random().toString(36).slice(2,9);let s,t;
  const fin=()=>{try{delete window[cb]}catch(e){window[cb]=void 0};if(s&&s.parentNode)s.parentNode.remove?s.remove():s.parentNode.removeChild(s);clearTimeout(t)};
  t=setTimeout(()=>{fin();rej(Error('TIMEOUT'))},ms);
  window[cb]=r=>{fin();r&&r.table?res(r.table.rows.map(x=>(x.c||[]).map(c=>c?c.v:null))):rej(Error('EMPTY'))};
  s=document.createElement('script');
  s.src="https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:json;responseHandler:"+cb+";reqId:"+Date.now()
    +"&sheet="+encodeURIComponent(SNAME)+"&tq="+encodeURIComponent(q);
  s.onerror=()=>{fin();rej(Error('BLOQ'))};document.head.appendChild(s)})}

function sel(){let r=CUBE;

  if(fC!=='TODAS')r=r.filter(x=>(x[3]||BL)===fC);
  return r}
function agg(rows){const byC={},byT={},byE={};
  rows.forEach(x=>{const c=x[0]||BL;byC[c]=(byC[c]||0)+x[4];
    const t=(x[1]&&x[1]!=='-')?x[1]:'Sem tabulação';byT[t]=(byT[t]||0)+x[4];
    const e=empOf(x[0]);if(e!=='—')byE[e]=(byE[e]||0)+x[4]});
  const tot=rows.reduce((s,x)=>s+x[4],0);
  const g=rows.filter(x=>kind(x[1])==='g').reduce((s,x)=>s+x[4],0);
  const d=rows.filter(x=>/^discador/i.test(String(x[1]||''))).reduce((s,x)=>s+x[4],0);
  return{byC,byT,byE,tot,venda:g,disc:d}}
const srt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);

/* ───── séries / buckets ───── */
function inRange(s){return (!d1||s>=d1)&&(!d2||s<=d2)}
function bucket(s){const d=parse(s);
  if(gran==='mes')return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if(gran==='semana'){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return iso(x)}
  return s}
function bLabel(k){
  if(gran==='mes'){const[y,m]=k.split('-');return MES[+m-1]+'/'+y.slice(2)}
  if(gran==='semana')return brd(k);
  return brd(k)}
function series(from,to){
  const m={};
  SERIE.forEach(([s,l,v,f])=>{ if(from&&s<from)return; if(to&&s>to)return;
    const k=bucket(s); m[k]=m[k]||{l:0,v:0,f:0}; m[k].l+=l; m[k].v+=v; m[k].f+=f});
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))}
/* período anterior de mesmo tamanho */
function prevRange(){ if(!d1||!d2)return[null,null];
  const a=parse(d1),b=parse(d2);const dias=Math.round((b-a)/864e5)+1;
  const pb=new Date(a);pb.setDate(pb.getDate()-1);const pa=new Date(pb);pa.setDate(pa.getDate()-(dias-1));
  return[iso(pa),iso(pb)]}
function sumSerie(from,to){let l=0,v=0,f=0;
  SERIE.forEach(([s,a,b,c])=>{if(from&&s<from)return;if(to&&s>to)return;l+=a;v+=b;f+=c});return{l,v,f}}

/* ───── delta ───── */
function delta(cur,prev,invert){
  if(!prev)return{cls:'flat',txt:'—',arw:''};
  const p=(cur-prev)/prev*100;
  const good=invert? p<0 : p>0;
  const cls=Math.abs(p)<0.5?'flat':(good?'up':'dn');
  return{cls,txt:(p>0?'+':'')+p.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%',
    arw:Math.abs(p)<0.5?'':(p>0?'u':'d')}}

/* ───── gráficos SVG ───── */
function area(pts,color,h){ /* pts: [[label,val]] */
  const w=CW(); h=(w>=880?230:(h||155)); const pl=34,pr=24,pt=12,pb=24;
  if(!pts.length)return '<div class="info">Sem dados no período.</div>';
  const mx=Math.max(...pts.map(p=>p[1]),1);
  const X=i=>pl+(w-pl-pr)*(pts.length<2?0.5:i/(pts.length-1));
  const Y=v=>pt+(h-pt-pb)*(1-v/mx);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
  const fill=`${line} L${X(pts.length-1).toFixed(1)} ${h-pb} L${X(0).toFixed(1)} ${h-pb} Z`;
  const ticks=[0,.5,1].map(f=>{const v=mx*f,y=Y(v);
    return `<line class="gl" x1="${pl}" x2="${w-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>
            <text class="ax" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${n(v)}</text>`}).join('');
  const step=Math.max(1,Math.ceil(pts.length/6));
  const lbl=pts.map((p,i)=>i%step===0||i===pts.length-1?
    `<text class="ax" x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle">${esc(bLabel(p[0]))}</text>`:'').join('');
  const id='g'+Math.random().toString(36).slice(2,7);
  const dots=pts.length<=31?pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.4" fill="${color}"><title>${esc(bLabel(p[0]))}: ${n(p[1])}</title></circle>`).join(''):'';
  return `<div class="cw"><svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".30"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>${ticks}
    <path d="${fill}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${lbl}</svg></div>`}

function bars(pts,color,h){
  const w=CW(); h=(w>=880?250:(h||165)); const pl=34,pr=24,pt=12,pb=26;
  if(!pts.length)return '<div class="info">Sem dados no período.</div>';

  return `<div class="cw"><svg class="chart" viewBox="0 0 ${w} ${h}">${ticks}${bs}

function donut(slices,total){
  const R=52,C=2*Math.PI*R,w=150;let off=0;

      transform="rotate(-90 75 75)" stroke-linecap="butt"><title>${esc(s.k)}: ${n(s.v)}</title></circle>`;
    off+=len;return el}).join('');
  return `<div class="cw" style="max-width:${w}px;margin:0 auto"><svg class="chart" viewBox="0 0 150 150">

function countUp(el,to){
  if(RM){el.textContent=typeof to==='string'?to:n(to);return}

  const t0=performance.now(),dur=650;
  const st=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);

    :(d?`<div class="kd ${d.cls}">${d.arw?`<span class="arw ${d.arw}"></span>`:''}${d.txt}<span style="color:var(--ink3);font-weight:400"> vs anterior</span></div>`:'');
  return `<div class="k ${cls||''}" style="animation-delay:${i*45}ms">
    <div class="kl">${lab}</div><div class="kv num" data-v="${typeof val==='number'?val:''}">${typeof val==='number'?'0':val}</div>${dd}${spk||''}</div>`}
function animKPIs(root){root.querySelectorAll('.kv[data-v]').forEach(el=>{
  const v=el.getAttribute('data-v'); if(v!=='')countUp(el,+v)})}

/* ───── VIEWS ───── */
function vResumo(){
  const A=agg(sel()),P=prevRange();
  const cur=sumSerie(d1,d2),prv=sumSerie(P[0],P[1]);
  const s=series(d1,d2);
  const leadsSerie=s.map(x=>[x[0],x[1].l]);
  const conv=A.tot?A.venda/A.tot:0;
  const convPrev=prv.l&&prv.v?prv.v/prv.l:0;
  const html=`
  ${live?'':warnBox()}
  <div class="kg">
    ${kpi('Leads',live?A.tot:(cur.l||A.tot),delta(cur.l||A.tot,prv.l),'a',spark(leadsSerie.map(x=>x[1]),'var(--accent)'),0)}
    ${kpi('Vendas novas',A.venda,live?delta(cur.v,prv.v):null,'g','',1,live?null:'todo o período')}
    ${kpi('Conversão',pc(A.venda,A.tot),live&&convPrev?delta(conv,convPrev):null,'','',2,live?null:'todo o período')}
    ${kpi('No discador',A.disc,null,'','',3,live?null:'todo o período')}
  </div>
  <div class="card wide"><div class="ch"><h3>Entrada de leads</h3><span class="m">${granLabel()}</span></div>
    ${area(leadsSerie,'var(--accent)',160)}
    <div class="lgd"><span><i style="background:var(--accent)"></i>Leads</span></div></div>
  <div class="card"><div class="ch"><h3>Top campanhas</h3><span class="m">${srt(A.byC).length} no total</span></div>
    ${listRows(srt(A.byC).slice(0,5),A.tot,c=>`<span class="tg s">${esc(empOf(c))}</span>`)}</div>
  <div class="card"><div class="ch"><h3>Qualidade das tabulações</h3></div>
    ${listRows(srt(A.byT).slice(0,6),A.tot,null,true)}</div>`;
  return html}

function granLabel(){return gran==='dia'?'por dia':gran==='semana'?'por semana':'por mês'}

function vLeads(){
  const s=series(d1,d2),pts=s.map(x=>[x[0],x[1].l]);
  const tot=pts.reduce((a,p)=>a+p[1],0),avg=pts.length?tot/pts.length:0;
  const best=pts.slice().sort((a,b)=>b[1]-a[1])[0],worst=pts.slice().sort((a,b)=>a[1]-b[1])[0];
  const P=prevRange(),prv=sumSerie(P[0],P[1]);
  const rows=pts.map((p,i)=>{const pr=i>0?pts[i-1][1]:null;const d=pr?delta(p[1],pr):null;
    return `<tr><td>${esc(bLabel(p[0]))}</td><td><b>${n(p[1])}</b></td>
      <td>${d?`<span class="dl ${d.cls}">${d.txt}</span>`:'—'}</td></tr>`}).reverse().join('');
  return `${live?'':warnBox()}
  <div class="kg">
    ${kpi('Total',tot,delta(tot,prv.l),'a','',0)}
    ${kpi('Média '+(gran==='dia'?'/dia':gran==='semana'?'/semana':'/mês'),Math.round(avg),null,'','',1)}
    ${kpi('Melhor',best?best[1]:0,null,'g','',2)}
    ${kpi('Menor',worst?worst[1]:0,null,'','',3)}
  </div>
  <div class="card wide"><div class="ch"><h3>Volume de leads</h3><span class="m">${granLabel()}</span></div>
    ${bars(pts,'var(--orange)',170)}</div>
  <div class="card t wide"><div class="ch" style="padding:15px 16px 8px"><h3>Detalhe</h3><span class="m">${pts.length} períodos</span></div>
    <div class="tw"><table><thead><tr><th>Período</th><th>Leads</th><th>Variação</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="3">Sem dados.</td></tr>'}</tbody></table></div></div>`}

function vCamp(){
  const A=agg(sel());
  const list=srt(A.byC);
  const rows=sel().reduce((m,x)=>{const c=x[0]||BL;m[c]=m[c]||{t:0,v:0,d:0};m[c].t+=x[4];
    if(kind(x[1])==='g')m[c].v+=x[4]; if(/^discador/i.test(String(x[1]||'')))m[c].d+=x[4];return m},{});
  const tr=list.map(([c,v])=>{const o=rows[c]||{t:0,v:0,d:0};
    return `<tr><td>${esc(c)}</td><td>${n(v)}</td><td><b>${n(o.v)}</b></td><td>${pc(o.v,o.t)}</td>
      <td>${n(o.d)}</td></tr>`}).join('');
  return `${live?'':warnBox()}
  <div class="card"><div class="ch"><h3>Ranking por volume</h3><span class="m">${list.length} campanhas</span></div>
    ${listRows(list,A.tot,c=>`<span class="tg s">${esc(empOf(c))}</span>`,false,true)}</div>
  <div class="card t"><div class="ch" style="padding:15px 16px 8px"><h3>Desempenho</h3></div>
    <div class="tw"><table><thead><tr><th>Campanha</th><th>Leads</th><th>Vendas</th><th>Conv.</th><th>Discador</th></tr></thead>
    <tbody>${tr||'<tr><td colspan="5">Sem dados.</td></tr>'}</tbody></table></div></div>`}

function vEmp(){
  const A=agg(sel()),E=srt(A.byE);
  const per=sel().reduce((m,x)=>{const e=empOf(x[0]);if(e==='—')return m;
    m[e]=m[e]||{t:0,v:0,d:0};m[e].t+=x[4];
    if(kind(x[1])==='g')m[e].v+=x[4]; if(/^discador/i.test(String(x[1]||'')))m[e].d+=x[4];return m},{});
  const cols={GWA:'var(--orange)',M12:'var(--gold)',OFF:'var(--slate)'};
  const slices=E.map(([k,v])=>({k,v,c:cols[k]||'var(--blue)'}));
  const cards=E.map(([e,v],i)=>{const o=per[e];
    return `<div class="card" style="animation-delay:${i*50}ms"><div class="ch">
      <h3>${esc(e)}</h3><span class="m">${pc(v,A.tot)} dos leads</span></div>
      <div class="kg" style="margin:0">
        ${kpi('Leads',o.t,null,'a','',0)}${kpi('Vendas novas',o.v,null,'g','',1)}
        ${kpi('Conversão',pc(o.v,o.t),null,'','',2)}${kpi('No discador',o.d,null,'','',3)}
      </div></div>`}).join('');
  return `${live?'':warnBox()}
  <div class="card"><div class="ch"><h3>Participação por empresa</h3></div>
    <div class="dw">${donut(slices,A.tot)}
    <div class="lgd">${slices.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.k)} · ${n(s.v)}</span>`).join('')}</div></div></div>
  ${cards||'<div class="card"><p class="info">Sem dados de empresa no recorte.</p></div>'}`}

function vTab(){
  const A=agg(sel()),T=srt(A.byT);
  const slices=T.map(([k,v])=>({k,v,c:kColor[kind(k)]}));
  return `${live?'':warnBox()}
  <div class="card"><div class="ch"><h3>Distribuição</h3><span class="m">${n(A.tot)} leads</span></div>
    <div class="dw">${donut(slices,A.tot)}
    <div class="lgd">${slices.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.k)}</span>`).join('')}</div></div></div>
  <div class="card"><div class="ch"><h3>Por tabulação</h3></div>
    ${listRows(T,A.tot,null,true)}</div>`}

function listRows(list,total,tagFn,useKind,click){
  if(!list.length)return '<div class="info">Sem dados no recorte.</div>';
  const mx=list[0][1]||1;
  return list.map(([k,v],i)=>{
    const kk=useKind?kind(k):null;
    const mcls=useKind?({g:'g',b:'b',o:'',r:'r',s:'s'}[kk]):'';
    const tag=useKind?`<span class="tg ${kk==='g'?'g':kk==='b'?'b':kk==='o'?'o':kk==='r'?'r':'s'}">${kLabel[kk]}</span>`
      :(tagFn?tagFn(k):'');
    const El=click?'button':'div';
    return `<${El} class="row" style="animation-delay:${Math.min(i*30,400)}ms"${click?` data-c="${esc(k)}" aria-pressed="${fCamp===k}"`:''}>
      <span class="rn"><span>${esc(k)}</span>${tag}</span>
      <span class="rv num">${n(v)}<small>${pc(v,total)}</small></span>
      <span class="mt ${mcls}"><i style="width:${(v/mx*100).toFixed(1)}%;animation-delay:${Math.min(i*30,400)}ms"></i></span>
    </${El}>`}).join('')}

function warnBox(){return `<div class="warn"><div><b>Dados salvos.</b> Os totais por campanha, empresa e tabulação
  são de <b>todo o período</b> — ainda não respeitam o filtro de data. O gráfico de leads respeita.
  Publique a planilha em <code>Arquivo → Compartilhar → Publicar na web</code> para o painel ficar ao vivo,
  com canal e vendas por dia.</div></div>`}

/* ───── render ───── */
const VIEWS={resumo:vResumo,leads:vLeads,camp:vCamp,emp:vEmp,tab:vTab};
const TABS=[['resumo','Resumo','M3 11l9-8 9 8M5 10v10h14V10'],
  ['leads','Leads','M3 3v18h18M7 15l3-4 3 3 4-7'],
  ['camp','Campanhas','M3 11v3l14 5V6L3 11zM8 13v6M18 9a3 3 0 0 1 0 6'],
  ['emp','Empresas','M3 21V7l6-4 6 4v14M9 21v-5h3v5M18 21V11l3 2v8'],
  ['tab','Tabulações','M3 7h18M3 12h18M3 17h10']];

function render(){
  /* filtros */
  document.getElementById('cPer').innerHTML=Object.entries(PRE)
    .map(([k,[l]])=>`<button data-p="${k}" aria-pressed="${per===k}">${l}</button>`).join('');
  document.getElementById('d1').value=d1||''; document.getElementById('d2').value=d2||'';
  const emps={};CUBE.forEach(x=>{const e=empOf(x[0]);if(e!=='—')emps[e]=(emps[e]||0)+x[4]});
  document.getElementById('cEmp').innerHTML=['TODAS',...Object.keys(emps).sort((a,b)=>emps[b]-emps[a])]
    .map(e=>`<button data-e="${esc(e)}" aria-pressed="${fE===e}">${e==='TODAS'?'Todas':esc(e)}</button>`).join('');
  const mk=(id,vals,cur,ph)=>document.getElementById(id).innerHTML=
    `<option value="TODAS">${ph}</option>`+vals.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  mk('sOri',uni(2),fO,'Origem: todas'); mk('sCan',uni(3),fC,'Canal: todos');
  /* tabs */
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,p])=>
    `<li><button data-t="${k}" aria-current="${tab===k}"><svg viewBox="0 0 24 24"><path d="${p}"/></svg><span>${l}</span></button></li>`).join('');
  /* view ativa */
  TABS.forEach(([k])=>{const el=document.getElementById('v-'+k);
    el.classList.toggle('on',k===tab);
    if(k===tab){el.innerHTML=head(k)+VIEWS[k]();animKPIs(el)} else {el.innerHTML=''}});
  bind()}

function head(k){
  const H={resumo:['Visão geral','Como está a operação no período selecionado.'],
    leads:['Leads','Volume de entrada por dia, semana ou mês.'],
    camp:['Campanhas','Desempenho e conversão de cada campanha.'],
    emp:['Empresas','Comparativo entre GWA, M12 e OFF.'],
    tab:['Tabulações','Distribuição e qualidade dos atendimentos.']}[k];
  const g=k==='leads'||k==='resumo'?`<div class="chips gran" style="margin-top:10px">
    ${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([v,l])=>
      `<button data-g="${v}" aria-pressed="${gran===v}">${l}</button>`).join('')}</div>`:'';
  return `<div class="h"><h2>${H[0]}</h2><p>${H[1]}</p>${g}</div>`}

function bind(){
  document.querySelectorAll('#cPer button').forEach(b=>b.onclick=()=>{
    per=b.dataset.p;[d1,d2]=PRE[per][1]();load()});
  document.querySelectorAll('#cEmp button').forEach(b=>b.onclick=()=>{fE=b.dataset.e;fCamp=null;render()});
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo({top:0,behavior:RM?'auto':'smooth'})});
  document.querySelectorAll('.gran button').forEach(b=>b.onclick=()=>{gran=b.dataset.g;render()});
  document.querySelectorAll('.row[data-c]').forEach(b=>b.onclick=()=>{
    const c=b.dataset.c;fCamp=(fCamp===c)?null:c;render()});
  document.getElementById('sOri').onchange=e=>{fO=e.target.value;render()};
  document.getElementById('sCan').onchange=e=>{fC=e.target.value;render()};
  document.getElementById('d1').onchange=e=>{d1=e.target.value;per='custom';load()};
  document.getElementById('d2').onchange=e=>{d2=e.target.value;per='custom';load()};
}

/* ───── load ───── */
function stat(k,t){document.getElementById('dot').className='dot'+(k==='on'?' on':k==='off'?' off':'');
  document.getElementById('st').textContent=t}
async function load(){
  if(busy)return;busy=true;
  stat('','atualizando');document.getElementById('rf').classList.add('spin');
  try{
    const P=prevRange();
    const from=P[0]||d1;
    const [cube,serie]=await Promise.all([
      gviz(`select ${CAMP}, ${TAB}, ${ORI}, ${CAN}, count(${ID})${wh()} group by ${CAMP}, ${TAB}, ${ORI}, ${CAN}`),
      gviz(`select ${DAT}, ${TAB}, count(${ID}) where ${DAT} >= date '${from}' and ${DAT} <= date '${d2}' group by ${DAT}, ${TAB}`)
    ]);
    CUBE=cube.filter(r=>r[0]!=null).map(r=>[String(r[0]).trim(),r[1]==null?'':String(r[1]).trim(),
      r[2]==null?'':String(r[2]).trim(),r[3]==null?'':String(r[3]).trim(),+r[4]||0]);
    const m={};
    serie.forEach(r=>{const s=gdate(r[0]); if(!s)return;
      const t=r[1]==null?'':String(r[1]).trim(),c=+r[2]||0;
      m[s]=m[s]||[0,0,0]; m[s][0]+=c;
      if(kind(t)==='g')m[s][1]+=c; if(kind(t)==='b')m[s][2]+=c});
    SERIE=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,v])=>[s,v[0],v[1],v[2]]);
    live=true;stat('on','ao vivo · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    live=false;CUBE=SNAP.cube.slice();SERIE=SNAP.serie.map(x=>[x[0],x[1],0,0]);
    stat('off','dados salvos');
  }finally{busy=false;document.getElementById('rf').classList.remove('spin');render()}}

document.getElementById('rf').onclick=load;
let rz,lastW=window.innerWidth>=900;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  const w=window.innerWidth>=900; if(w!==lastW){lastW=w;render()}},180)});
render();load();setInterval(load,5*60*1000);
</script></body></html>
