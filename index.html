/* ═════ Modo slide (TV) ═════
   Passa pelas telas do painel em tela cheia, com os dados ao vivo. Telas compridas descem
   devagar até o fim antes de trocar. Lista, tempo de cada tela, período, velocidade e tamanho
   ficam em CFG.tv (Administração → Modo slide). Abrir com #slide no fim do link já liga o modo. */
const TV_TELAS=()=>{const L=[['resumo','Início'],['leads','Leads'],['camp','Campanhas'],['emp','Empresas'],['tab','Tabulações'],['fat','Faturamento'],['vendas','Vendas']];
  PTABS.forEach(([k,l])=>L.push(['perf:'+k,'Performance · '+l]));L.push(['relat','Relatórios']);return L};
const TV_NOME=t=>(TV_TELAS().find(x=>x[0]===t)||[,t])[1];
const TV_PADRAO=()=>TV_TELAS().map(([t])=>({t,e:'TODAS',s:20,on:1}));
const TV_VEL={lenta:45,media:75,rapida:120};
function tvCfg(){const c=CFG.tv||(CFG.tv={});if(!Array.isArray(c.telas)||!c.telas.length)c.telas=TV_PADRAO();
  c.periodo=c.periodo||'mes';c.vel=c.vel||'media';c.zoom=c.zoom||'auto';c.tema=c.tema||'dark';return c}
let TV={on:false};
const tvAtivas=()=>tvCfg().telas.filter(x=>x.on&&TV_TELAS().some(([t])=>t===x.t));
function tvLiga(cheia){if(TV.on)return;const C=tvCfg(),L=tvAtivas();if(!L.length){aviso('Nenhuma tela marcada no Modo slide');return}
  TV={on:true,i:-1,lista:L,ini:0,pausa:false,pausaEm:0,raf:0,salvo:{tab,fE,fCamp,pTab,per,d1,d2,y:scrollY,tema:document.documentElement.getAttribute('data-t')},trocando:false};
  document.body.classList.add('tv');
  if(C.tema!=='mantem')document.documentElement.setAttribute('data-t',C.tema);
  tvZoom();
  const b=document.createElement('div');b.id='tvBar';b.className='tvb';
  b.innerHTML=`<div class="tvb-l"><span class="plate tvb-logo">${document.querySelector('.plate').innerHTML}</span>
      <div class="tvb-t"><b id="tvTit"></b><span id="tvSub"></span></div></div>
    <div class="tvb-r"><span class="tvb-live"><span class="dot on" id="tvDot"></span><span id="tvSt"></span></span>
      <span class="tvb-d" id="tvDots">${L.map((_,i)=>`<i data-i="${i}"></i>`).join('')}</span><span class="tvb-n" id="tvN"></span><time class="tvb-h" id="tvHora"></time>
      <div class="tvb-c" id="tvCtl"><button id="tvAnt" aria-label="Tela anterior" title="Anterior (←)">‹</button>
        <button id="tvPausa" aria-label="Pausar" title="Pausar (espaço)">❚❚</button>
        <button id="tvPro" aria-label="Próxima tela" title="Próxima (→)">›</button>
        <button id="tvCheia" aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
        <button id="tvSai" aria-label="Sair do modo slide" title="Sair (Esc)">✕</button></div></div>
    <div class="tvb-p"><i id="tvProg"></i></div>`;
  document.body.appendChild(b);
  const g=id=>document.getElementById(id);
  g('tvAnt').onclick=()=>tvVai(TV.i-1);g('tvPro').onclick=()=>tvVai(TV.i+1);g('tvPausa').onclick=tvPausa;
  g('tvSai').onclick=tvDesliga;g('tvCheia').onclick=tvCheia;
  document.addEventListener('keydown',tvTecla);document.addEventListener('mousemove',tvMexeu);addEventListener('resize',tvZoom);
  if(cheia)tvCheia();else{tvDica('Clique em qualquer lugar para tela cheia');
    document.addEventListener('click',function c1(e){document.removeEventListener('click',c1,true);if(TV.on&&!document.fullscreenElement&&!e.target.closest('.tvb-c'))tvCheia()},true)}
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>TV.wake=w).catch(()=>{});
  TV.relogio=setInterval(tvRelogio,1000);tvRelogio();
  /* período da TV: um dos atalhos do topo; recalculado a cada volta (vira o dia sozinho) */
  if(C.periodo!=='atual'&&PRE[C.periodo]){per=C.periodo;const [a,z]=PRE[per][1]();if(a!==d1||z!==d2){d1=a;d2=z;load()}}
  logEv('Modo slide','ligado · '+L.length+' telas',true);
  tvVai(0)}
function tvDesliga(){if(!TV.on)return;cancelAnimationFrame(TV.raf);clearInterval(TV.relogio);clearTimeout(TV.dica);
  document.removeEventListener('keydown',tvTecla);document.removeEventListener('mousemove',tvMexeu);removeEventListener('resize',tvZoom);
  if(TV.wake)TV.wake.release().catch(()=>{});
  const s=TV.salvo;TV={on:false};
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  ['tvBar','tvDica'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()});
  document.body.classList.remove('tv','tv-cur');document.documentElement.style.removeProperty('--tvz');
  if(s.tema)document.documentElement.setAttribute('data-t',s.tema);else document.documentElement.removeAttribute('data-t');
  tab=s.tab;fE=s.fE;fCamp=s.fCamp;pTab=s.pTab;
  const mudouPer=s.d1!==d1||s.d2!==d2;per=s.per;d1=s.d1;d2=s.d2;
  if(location.hash.startsWith('#slide'))history.replaceState(null,'',location.pathname+location.search);
  render();scrollTo(0,s.y||0);if(mudouPer)load()}
function tvZoom(){const z=tvCfg().zoom;const v=z==='auto'?Math.max(1,Math.min(2.2,innerWidth/1240)):(+z||100)/100;
  document.documentElement.style.setProperty('--tvz',v)}
function tvCheia(){const el=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(el.requestFullscreen)el.requestFullscreen().then(()=>{const d=document.getElementById('tvDica');if(d)d.remove()}).catch(()=>{if(TV.on)tvDica('Clique aqui para tela cheia (ou F11)')})}
function tvDica(t){let d=document.getElementById('tvDica');if(!d){d=document.createElement('button');d.id='tvDica';d.className='tvdica';document.body.appendChild(d)}
  d.textContent=t;d.onclick=()=>{tvCheia();d.remove()};clearTimeout(TV.dica);TV.dica=setTimeout(()=>{if(d.parentNode)d.remove()},15000)}
function tvMexeu(){document.body.classList.remove('tv-cur');const c=document.getElementById('tvBar');if(c)c.classList.add('mx');
  clearTimeout(TV.mx);TV.mx=setTimeout(()=>{document.body.classList.add('tv-cur');const c2=document.getElementById('tvBar');if(c2)c2.classList.remove('mx')},2500)}
function tvTecla(e){if(!TV.on)return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();tvVai(TV.i+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();tvVai(TV.i-1)}
  else if(k===' '){e.preventDefault();tvPausa()}
  else if(k==='Escape')tvDesliga();
  else if(k==='f'||k==='F')tvCheia()}
function tvPausa(){if(!TV.on)return;TV.pausa=!TV.pausa;if(TV.pausa)TV.pausaEm=performance.now();else TV.ini+=performance.now()-TV.pausaEm;
  const b=document.getElementById('tvPausa');if(b){b.textContent=TV.pausa?'▶':'❚❚';b.setAttribute('aria-label',TV.pausa?'Continuar':'Pausar')}
  document.body.classList.toggle('tv-pausa',TV.pausa)}
function tvRelogio(){if(!TV.on)return;const h=document.getElementById('tvHora');if(h)h.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const st=document.getElementById('tvSt'),dt=document.getElementById('tvDot');
  if(st)st.textContent=busy?'atualizando…':ultOk?'ao vivo · '+haQuanto(ultOk):cacheTs?'dados de '+haQuanto(cacheTs):'carregando…';
  if(dt)dt.className='dot'+(ultOk&&Date.now()-ultOk<10*60000?' on':' off')}
function tvVai(i){if(!TV.on)return;const L=TV.lista,n=L.length;
  if(i>=n){i=0;const C=tvCfg();if(C.periodo!=='atual'&&PRE[C.periodo]){const [a,z]=PRE[C.periodo][1]();if(a!==d1||z!==d2){d1=a;d2=z;load()}}}
  if(i<0)i=n-1;
  cancelAnimationFrame(TV.raf);TV.i=i;const it=L[i],[t,sub]=it.t.split(':');
  const main=document.querySelector('main');main.classList.add('tv-sai');
  setTimeout(()=>{if(!TV.on)return;
    tab=t;if(sub)pTab=sub;fE=it.e||'TODAS';fCamp=null;render();scrollTo(0,0);main.classList.remove('tv-sai');
    document.getElementById('tvTit').textContent=TV_NOME(it.t);
    document.getElementById('tvSub').textContent=`${fE==='TODAS'?'Todas as empresas':fE} · ${dl(d1)} a ${dl(d2)}`;
    document.getElementById('tvN').textContent=`${i+1}/${n}`;
    document.querySelectorAll('#tvDots i').forEach((d,j)=>d.className=j===i?'on':j<i?'ok':'');
    TV.ini=performance.now();TV.pausaEm=TV.ini;if(TV.pausa)TV.pausaEm=TV.ini;
    TV.raf=requestAnimationFrame(tvPasso)},280)}
/* linha do tempo de cada tela: parada no topo → desce devagar até o fim → parada no fim → próxima.
   Se o tempo configurado não der para descer tudo na velocidade escolhida, a tela ganha o tempo que faltar. */
function tvPasso(agora){if(!TV.on)return;TV.raf=requestAnimationFrame(tvPasso);if(TV.pausa)return;
  const it=TV.lista[TV.i],T=Math.max(5,+it.s||20)*1000,el=document.scrollingElement||document.documentElement;
  const dist=Math.max(0,el.scrollHeight-innerHeight),vel=TV_VEL[tvCfg().vel]||75;
  const top=Math.min(4000,T*0.25),fim=dist>8?2500:0,desce=dist>8?Math.max(T-top-fim,dist/vel*1000):0,tot=Math.max(T,top+desce+fim);
  const t=agora-TV.ini;
  if(dist>8&&t>top){const p=Math.min(1,(t-top)/desce),e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;el.scrollTop=Math.round(e*dist)}
  const pr=document.getElementById('tvProg');if(pr)pr.style.transform=`scaleX(${Math.min(1,t/tot)})`;
  if(t>=tot)tvVai(TV.i+1)}
/* link que já abre no modo slide com a configuração desta tela (para a TV não precisar de login) */
function tvLink(){const j=JSON.stringify(tvCfg());const b=btoa(unescape(encodeURIComponent(j))).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
  return location.origin+location.pathname+'#slide='+b}
function tvDoLink(){const h=location.hash;if(!h.startsWith('#slide'))return false;
  const m=h.match(/^#slide=([A-Za-z0-9+/_-]+)/);
  if(m){try{const c=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(c&&Array.isArray(c.telas)){CFG.tv=c;salvaCfg()}}catch(e){}}
  return true}

/* ── Administração → Modo slide ── */
let tvAdd=false;
function aTv(){const C=tvCfg(),L=C.telas,emps=['TODAS',...new Set(CUBE.map(x=>empOf(x[0])).filter(e=>e!=='—'))];

      <label class="cf"><span>Tamanho na TV</span><select id="tvZoomSel">${opt('auto','Automático',C.zoom)}${[100,125,150,175,200].map(z=>opt(z,z+'%',C.zoom)).join('')}</select></label>

  <div class="card wide t"><div class="ch" style="padding:15px 16px 8px"><h3>Telas e tempo de cada uma</h3>
      <span class="m">${L.filter(x=>x.on).length} ativas · ciclo de ~${Math.floor(tot/60)} min ${tot%60} s</span></div>
    <div class="tw"><table class="xl tv-t"><thead><tr><th>Mostrar</th><th>Tela</th><th>Empresa</th><th>Tempo (s)</th><th></th></tr></thead>
    <tbody>${L.map((x,i)=>`<tr${x.on?'':' class="tv-off"'}><td><input type="checkbox" class="tv-on" data-i="${i}"${x.on?' checked':''} aria-label="Mostrar ${esc(TV_NOME(x.t))}"></td>
      <td class="lft"><b>${esc(TV_NOME(x.t))}</b></td>
      <td><select class="tv-e" data-i="${i}" aria-label="Empresa da tela ${esc(TV_NOME(x.t))}">${emps.map(e=>opt(e,e==='TODAS'?'Todas':e,x.e||'TODAS')).join('')}</select></td>
      <td><input class="kp-in tv-s" data-i="${i}" value="${+x.s||20}" inputmode="numeric" aria-label="Segundos da tela ${esc(TV_NOME(x.t))}"></td>

    ${tvAdd?`<div class="kp-add"><div class="kp-novo"><label class="cf"><span>Tela</span><select id="tvNovaT">${TV_TELAS().map(([t,l])=>opt(t,l,'')).join('')}</select></label>

      <div class="acts"><button class="btn pri" id="tvAddOk">Adicionar</button><button class="btn" id="tvAddX">Cancelar</button></div></div>`:''}
    <div class="acts" style="padding:12px 16px"><button class="btn pri" id="tvSalva">Salvar</button><button class="btn" id="tvTesta">Salvar e ver agora</button>
      <button class="btn" id="tvAddAbre">+ Adicionar tela</button><button class="btn" id="tvLinkBt">Copiar link da TV</button><button class="btn" id="tvPad">Lista padrão</button></div>
    <p class="info" style="margin:0 16px 14px">O link da TV já leva esta configuração: abra no navegador da TV e o modo slide começa sozinho, sem precisar de login. Mudou algo aqui? Copie o link de novo.</p></div>`}
function bindTv(){const C=tvCfg(),g=id=>document.getElementById(id),q=(id,f)=>{const el=g(id);if(el)el.onclick=f};
  const le=()=>{let ruim=0;C.periodo=g('tvPer').value;C.vel=g('tvVel').value;C.zoom=g('tvZoomSel').value;C.tema=g('tvTema').value;
    const todos=parseInt(g('tvTodos').value,10);

    document.querySelectorAll('.tv-e').forEach(s=>C.telas[+s.dataset.i].e=s.value);
    document.querySelectorAll('.tv-s').forEach(i=>{const v=parseInt(i.value,10);if(!(v>=5&&v<=600)){ruim++;return}C.telas[+i.dataset.i].s=v});
    if(g('tvTodos').value.trim()){if(todos>=5&&todos<=600)C.telas.forEach(x=>x.s=todos);else ruim++}
    if(ruim){aviso('Tempo de cada tela: de 5 a 600 segundos');return false}return true};
  const salva=()=>{if(!le())return false;salvaCfg();logEv('Administração','modo slide salvo',true,C.telas.filter(x=>x.on).length);return true};
  q('tvSalva',()=>{if(salva()){aMsg='Modo slide salvo.';render()}});

  q('tvAddOk',()=>{if(!le())return;const s=parseInt(g('tvNovaS').value,10);C.telas.push({t:g('tvNovaT').value,e:g('tvNovaE').value,s:s>=5&&s<=600?s:20,on:1});
    tvAdd=false;salvaCfg();render()});

    try{await navigator.clipboard.writeText(l);aviso('Link da TV copiado')}catch(e){prompt('Copie o link da TV:',l)}});
  const mv=(i,d)=>{if(!le())return;const L=C.telas,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];salvaCfg();render()};

  document.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{if(!le())return;C.telas.splice(+b.dataset.trm,1);salvaCfg();render()});
  document.querySelectorAll('.tv-on').forEach(i=>i.onchange=()=>i.closest('tr').classList.toggle('tv-off',!i.checked))}

/* ═════ KPIs da reunião ═════
   Catálogo de indicadores calculados + KPIs próprios (valor digitado). Metas por nível:

const KPI_CAT={

/* valor de um KPI para a campanha c (agregados c.o/c.p e tabulações c.tb/c.tbp) */
function kpiValor(key,c,D,ant){const o=ant?c.p:c.o,tb=ant?c.tbp:c.tb,dias=ant?D.diasP:D.dias;

  const soma=f=>Object.entries(tb.m||{}).filter(([t])=>f(t)).reduce((q,[,v])=>q+v,0);

    case'lf':return o.lf;case'cpl':return o.cpl;case'inv':return o.inv;case'margem':return o.margem;case'icr':return o.icr;case'roi':return o.roi;
    case'roas':return o.roas;case'cpa':return o.cac;case'tk':return o.ticket;case'fat':return o.fat;case'lucro':return o.inv||o.fat?o.fat-o.inv:null;

function bindKpis(){const K=kpiCfg(),g=id=>document.getElementById(id);

    const M=K.metas[nivel]=Object.assign({},K.metas[nivel]||{});

    document.querySelectorAll('[data-km]').forEach(i=>{const v=num(i.value),k=i.dataset.km;if(v===null){ruim++;return}
      if(v!=='')M[k]=v;else if(nivel==='*'&&CFG_PADRAO.kpi.metas['*'][k]!=null)M[k]='';else delete M[k]});
    const [pa,pb]=prevRange();
    [['data-kv',d1,d2],['data-kvp',pa,pb]].forEach(([at,a,b])=>{const ch=kpiChaveVal(nivel,a,b);const V=K.val[ch]=Object.assign({},K.val[ch]||{});

/* ═════ Modo apresentação ═════

const PXI=96,PT=96/72;

function PresHTML(){this.slides=[];this.layout='LAYOUT_WIDE';

  this.charts={BAR:'bar',LINE:'line',DOUGHNUT:'doughnut',PIE:'pie'}}
PresHTML.prototype.addSlide=function(){const s={bg:null,el:[]};this.slides.push(s);
  return{set background(v){s.bg=v},get background(){return s.bg},
    addText:(t,o)=>s.el.push(['text',t,o||{}]),addShape:(k,o)=>s.el.push(['shape',k,o||{}]),addImage:o=>s.el.push(['img',o||{}]),
    addTable:(r,o)=>s.el.push(['table',r,o||{}]),addChart:(k,d,o)=>s.el.push(['chart',k,d,o||{}]),addNotes:()=>{}}};
/* formato de número no estilo do Excel/PowerPoint ('"R$ "#,##0.00', '0.0"%"') */
function fmtCod(v,cod){if(v==null||!isFinite(v))return'';if(!cod)return(+v).toLocaleString('pt-BR',{maximumFractionDigits:2});
  const pre=(cod.match(/^"([^"]*)"/)||[,''])[1],suf=(cod.match(/"([^"]*)"$/)||[,''])[1];
  const core=cod.replace(/^"[^"]*"/,'').replace(/"[^"]*"$/,''),dec=((core.split('.')[1]||'').match(/0/g)||[]).length;
  return pre+(+v).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:core.indexOf(',')>=0})+suf}
const pxI=v=>Math.round((+v||0)*PXI*100)/100;
const caixa=o=>`left:${pxI(o.x)}px;top:${pxI(o.y)}px;width:${pxI(o.w)}px;height:${pxI(o.h)}px`;
function pvTexto(t,o){

  let html='',par='';
  const fecha=()=>{html+=`<p style="margin:0 0 ${o.paraSpaceAfter?o.paraSpaceAfter*PT:0}px">${par||'&nbsp;'}</p>`;par=''};
  runs.forEach(r=>{const ro=Object.assign({},o,r.options||{});
    const st=`color:${hx(ro.color||'000000')};font-size:${(ro.fontSize||18)*PT}px;font-weight:${ro.bold?700:500};${ro.italic?'font-style:italic;':''}${ro.charSpacing?`letter-spacing:${ro.charSpacing*PT}px;`:''}`;
    String(r.text==null?'':r.text).split('\n').forEach((pedaco,i)=>{if(i>0)fecha();par+=`<span style="${st}">${esc(pedaco)}</span>`});
    if(ro.breakLine)fecha()});

function pvForma(k,o){

    const [x1,y1,x2,y2]=o.flipV?[0,h,w,0]:[0,0,w,h];
    return `<svg class="pv-ab" style="left:${pxI(o.x)-(w?0:lw/2)}px;top:${pxI(o.y)-(h?0:lw/2)}px;width:${W}px;height:${H}px;overflow:visible"><line x1="${x1+(w?0:lw/2)}" y1="${y1+(h?0:lw/2)}" x2="${x2+(w?0:lw/2)}" y2="${y2+(h?0:lw/2)}" stroke="${lc}" stroke-width="${lw||1}"${ln.dashType&&ln.dashType!=='solid'?' stroke-dasharray="5 4"':''}/></svg>`}

  return `<div class="pv-ab" style="${caixa(o)};background:${f};${lw?`border:${lw}px ${ln.dashType&&ln.dashType!=='solid'?'dashed':'solid'} ${lc};`:''}${r}box-sizing:border-box"></div>`}
function pvTabela(rows,o){

  p2:v=>v==null||!isFinite(v)?'—':(v*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%',

/* variação no formato "+85 (+212,5%)" */
function rVar(c,p,tipo){
  if(c==null||p==null||!isFinite(c)||!isFinite(p))return '—';
  const d=c-p, rel=p?d/Math.abs(p):null, rs=rel==null?'':` (${R.sg(rel)}${R.d1(Math.abs(rel*100))}%)`;
  const s=R.sg(d),a=Math.abs(d);
  if(tipo==='pp')return `${s}${R.d1(a*100)}pp${rs}`;
  if(tipo==='pp0')return `${s}${Math.round(a*100)}pp${rs}`;
  if(tipo==='m2')return `${s}R$ ${R.d2(a)}${rs}`;
  if(tipo==='m0')return `${s}R$ ${NF.format(Math.round(a))}${rs}`;
  if(tipo==='d')return `${s}${R.d1(a)} dias${rs}`;
  if(tipo==='x')return `${s}${R.d2(a)}${rs}`;
  if(tipo==='d1')return `${s}${R.d1(a)}${rs}`;
  return `${s}${NF.format(Math.round(a))}${rs}`}

let rnCache=null;
async function gerarReuniao(modo){
  const apresentar=modo==='apresentar';
  if(rnBusy)return;
  if(!admOk()){aviso('Entre na Administração para usar a Reunião');return}
  if(fE==='TODAS'){aviso('Escolha uma empresa no filtro de cima');return}
  const titulo=`Reunião Online · ${fE} · ${dc(d1)} a ${dc(d2)}`;
  if(apresentar)pvAbre(titulo);
  rnBusy=true;rnMsg='Preparando os dados…';render();
  const passo=t=>{rnMsg=t;render();if(apresentar)pvMsg(t)};
  const salvo={fO,fC,fCamp,fServ,fOn,fBase,SER};
  try{
    if(!apresentar){passo('Carregando o gerador de PowerPoint…');await carregaPptx()}
    /* a apresentação é sempre da empresa inteira, sem filtros de campanha/origem/canal */
    fCamp=null;fServ='TODAS';fOn='TODOS';fBase='venda';
    if(fO!=='TODAS'||fC!=='TODAS'){fO='TODAS';fC='TODAS';
      const [pa]=prevRange();const ser=await gviz(`select ${DAT}, ${CAMP}, ${TAB}, count(${ID}) where ${DAT} >= date '${pa||d1}' and ${DAT} <= date '${d2}' group by ${DAT}, ${CAMP}, ${TAB}`,60000);
      SER=ser.map(r=>[gdate(r[0]),r[1]==null?'':nc(r[1]),r[2]==null?'':String(r[2]).trim(),+r[3]||0]).filter(r=>r[0])}
    /* leads/BM do mesmo recorte ficam guardados 3 minutos: apresentar e depois baixar não busca de novo */
    const ch=`${fE}|${d1}|${d2}`;let extra;
    if(rnCache&&rnCache.k===ch&&Date.now()-rnCache.t<180000)extra=rnCache.x;
    else{passo('Buscando formulários, leads e contas de anúncio…');extra=await rnExtras();rnCache={k:ch,t:Date.now(),x:extra}}
    passo('Montando os slides…');
    const pres=apresentar?new PresHTML():new window.PptxGenJS();pres.layout='LAYOUT_WIDE';
    pres.author='GWA Consultoria';pres.company='GWA Consultoria';
    pres.title=`Reunião Online - ${fE} - ${dc(d1)} a ${dc(d2)}`;
    const D=rnDados(extra);
    const passos=[['capa',rnCapa]];
    D.camps.forEach((c,i)=>{
      passos.push(['camp',p=>rnKpis(p,D,c)],['camp',p=>rnTabs(p,D,c)]);
      if(i===0)passos.push(['aprov',p=>rnAprov(p,D,c)]);
      if(c.o.leads>=50)passos.push(['target',p=>rnTarget(p,D,c)]);
      if(i===0&&D.linhas.length>=1)passos.push(['linha',p=>rnLinha(p,D,c)])});
    passos.push(['balanc',rnBalanc]);
    D.forms.forEach(f=>passos.push(['form',p=>rnForm(p,D,f)]));
    passos.push(['qual',rnQual],['custos',rnCustos],['ticket',rnTicket],['semanal',rnSemanal]);
    if(D.bms.length)passos.push(['bm',rnBM]);
    passos.push(['fim',rnFim]);
    let feitos=0;
    for(const [sec,fn] of passos){if(!rnSecoes[sec])continue;
      try{fn.length===2?fn(pres,D):fn(pres);feitos++}
      catch(e){logEv('Reunião','erro no slide '+sec,false,0,0,e.message);console.error(e)}}
    if(apresentar){pvMostra(pres);logEv('Reunião','apresentação aberta na tela: '+fE,true,feitos);rnMsg=''}
    else{const nome=`Reuniao_${fE}_${dc(d1).replace(/\//g,'-')}_a_${dc(d2).replace(/\//g,'-')}.pptx`;
      await pres.writeFile({fileName:nome});
      logEv('Reunião','apresentação gerada: '+nome,true,feitos);
      rnMsg='';aviso(`Apresentação pronta · ${feitos} slides`)}
  }catch(e){rnMsg='Erro: '+e.message;logEv('Reunião','falha ao gerar',false,0,0,e.message);if(apresentar)pvMsg('Não deu para montar a apresentação: '+e.message,true)}
  finally{fO=salvo.fO;fC=salvo.fC;fCamp=salvo.fCamp;fServ=salvo.fServ;fOn=salvo.fOn;fBase=salvo.fBase;SER=salvo.SER;
    rnBusy=false;render()}}

/* consultas extras só da reunião: formulários (cadastros), leads do período (para o BM) e leads antigos das vendas */
async function rnExtras(){
  const out={forms:[],formsAnt:[],leads:[],velhos:[],M:null};const [pa,pb]=prevRange();
  const fcol=CFG.leads.col.form||'M';
  const qf=(a,b)=>gviz(`select ${CAMP}, ${fcol}, ${TAB}, count(${ID}) where ${DAT} >= date '${a}' and ${DAT} <= date '${b}' and ${CAMP} contains 'CADASTRO' group by ${CAMP}, ${fcol}, ${TAB}`,45000).catch(()=>[]);
  const lin=r=>({ck:r[0]==null?'':String(r[0]).trim(),d:gdate(r[1]),form:r[2],canal:r[3],camp:r[4]==null?'':nc(r[4])});
  const ql=gviz(`select ${ID}, ${DAT}, ${fcol}, ${CAN}, ${CAMP} where ${DAT} >= date '${d1}' and ${DAT} <= date '${d2}' and ${CAMP} contains '${fE}'`,90000)
    .then(r=>r.map(lin).filter(x=>x.d&&empOf(x.camp)===fE)).catch(()=>null);
  const m=CFG.custos.meta;
  const temConta=(RAW.meta||[]).some(r=>r&&r[6]!=null&&r[6]!=='');
  const qm=temConta?Promise.resolve(RAW.meta):gvizK(SH_META,`select ${m.mes}, ${m.gasto}, ${m.campanha}, ${m.empresa}, ${m.empConta}, ${m.atualiz}, ${m.conta||'D'}, ${m.nome||'B'}`).catch(()=>null);
  let meta;[out.forms,out.formsAnt,out.leads,meta]=await Promise.all([qf(d1,d2),pa?qf(pa,pb):Promise.resolve([]),ql,qm]);
  if(meta&&out.leads){out.M=bmMotor(meta);
    /* vendas do período cujo lead foi criado antes: busca esses cards pela chave */
    const tem=new Set(out.leads.map(x=>x.ck));
    const noPer=x=>x.e===fE&&finDate(x)&&finDate(x)>=d1&&finDate(x)<=d2&&x.ck&&!tem.has(x.ck)&&/^[\w.-]+$/.test(x.ck);
    const falta=[...new Set(SALES.filter(noPer).concat(FIN.filter(noPer)).map(x=>x.ck))];
    const lotes=[];for(let i=0;i<falta.length;i+=50)lotes.push(falta.slice(i,i+50));
    if(lotes.length){rnMsg=`Ligando ${falta.length} vendas aos leads de meses anteriores…`;render()}
    const res=await Promise.all(lotes.map(l=>gviz(`select ${ID}, ${DAT}, ${fcol}, ${CAN}, ${CAMP} where ${l.map(k=>`${ID} = '${k}'`).join(' or ')}`,90000).catch(()=>[])));
    out.velhos=res.flat().map(lin).filter(x=>x.ck)}
  return out}

function rnDados(X){
  const a=d1,b=d2,[pa,pb]=prevRange();
  const T=dsTot(a,b),P=dsTot(pa,pb),C=dsAgg(a,b,K_CAMP),CP=dsAgg(pa,pb,K_CAMP);
  const dias=Math.max(1,dsDias(a,b)),diasP=Math.max(1,dsDias(pa,pb));
  const camps=Object.entries(C).filter(([k,o])=>k&&k!==BL&&(o.leads>0||o.nv>0)&&empOf(k)===fE)
    .sort((x,y)=>y[1].leads-x[1].leads).map(([k,o])=>{
      const tb=tabsCamp(a,b,k),tbp=tabsCamp(pa,pb,k);
      const tgt=Object.entries(tb.m).filter(([t])=>ehTarget(t)).reduce((s,[,v])=>s+v,0);
      const tgtP=Object.entries(tbp.m).filter(([t])=>ehTarget(t)).reduce((s,[,v])=>s+v,0);
      return{k,nome:nomeCamp(k),o,p:CP[k]||dsDeriva({inv:0,leads:0,nv:0,fat:0,tot:0,dsum:0,dn:0,velho:0,src:{}}),
        tb,tbp,tgt,tgtP,conv:convDiaria(a,b,k)}});
  const tgtTot=camps.reduce((s,c)=>s+c.tgt,0);
  /* linhas de WhatsApp = coluna CANAL da campanha principal */
  const top=camps[0];const lm={};
  if(top)CUBE.forEach(x=>{if(x[0]!==top.k)return;const ln=x[3]||'(sem canal)';const o=lm[ln]||(lm[ln]={rec:0,nt:0,sr:0,q:0,v:0});
    o.rec+=x[4];const t=x[1];if(ehSemTrab(t))o.nt+=x[4];else if(ehNaoAt(t))o.sr+=x[4];if(ehTarget(t))o.q+=x[4];if(kind(t)==='g')o.v+=x[4]});
  const linhas=Object.entries(lm).filter(([k,o])=>o.rec>=20).sort((x,y)=>y[1].rec-x[1].rec).slice(0,6).map(([k,o])=>{
    const tr=o.rec-o.nt,rs=tr-o.sr;return{nome:(String(k).match(/(\d{4})\D*$/)||[,k])[1],canal:k,rec:o.rec,tr,nt:o.nt,rs,sr:o.sr,q:o.q,v:o.v,
      pResp:tr?rs/tr:null,pQ:o.rec?o.q/o.rec:null,pV:o.rec?o.v/o.rec:null,aprov:o.rec?tr/o.rec:null}});
  /* formulários dos cadastros da empresa */
  const agF=rows=>{const m={};rows.forEach(r=>{const c=nc(r[0]);if(empOf(c)!==fE)return;const f=String(r[1]||'(sem formulário)').trim();
    const o=m[f]||(m[f]={camp:c,t:0,tab:{}});const t=(r[2]&&r[2]!=='-')?String(r[2]).trim():'Sem tabulação';o.tab[t]=(o.tab[t]||0)+(+r[3]||0);o.t+=(+r[3]||0)});return m};
  const FA=agF(X.forms||[]),FP=agF(X.formsAnt||[]);
  const forms=Object.entries(FA).filter(([f,o])=>o.t>=20).sort((x,y)=>y[1].t-x[1].t).slice(0,4).map(([f,o])=>({f,...o,ant:FP[f]||null}));
  /* BM: custo pela conta de anúncio; leads pelo formulário/linha de WhatsApp; vendas pela chave do card */
  const BMR=X.M?bmCalc(X.M,X.leads||[],X.velhos||[],a,b):null;
  const bms=BMR?BMR.lista.slice(0,4):[];
  /* ticket médio por mês no ano */
  const ano=parse(b).getFullYear(),mf=parse(b).getMonth();const tk=[];
  for(let mm=0;mm<=mf;mm++){const ini=`${ano}-${String(mm+1).padStart(2,'0')}-01`,fim=iso(new Date(ano,mm+1,0));
    const fimE=mm===mf?b:fim;const s=SALES.filter(x=>{const d=finDate(x);return d&&d>=ini&&d<=fimE&&dsOkF(x)});
    tk.push({m:mm,v:s.length?s.reduce((q,x)=>q+x.tot,0)/s.length:null,n:s.length})}
  const W=dsSemanas(a,b);
  return{a,b,pa,pb,T,P,C,CP,dias,diasP,camps,tgtTot,linhas,forms,bms,BMR,tk,W,
    periodo:`${parse(a).getDate()} a ${parse(b).getDate()}/${MESC[parse(b).getMonth()]}`,
    periodoC:`${String(parse(a).getDate()).padStart(2,'0')}-${String(parse(b).getDate()).padStart(2,'0')} ${MESC[parse(b).getMonth()]}`,
    mesAno:`${MESC[parse(b).getMonth()]} ${parse(b).getFullYear()}`,mes:MESC[parse(b).getMonth()],
    ndias:Math.round((parse(b)-parse(a))/864e5)+1,
    antTxt:`${dc(pa)} a ${dc(pb)}`}}

      <li>Performance por BM: o custo vem da conta de anúncio de cada BM. O lead entra no BM da campanha do formulário dele ou da campanha que anunciou a linha de WhatsApp naquele mês; linhas sem campanha usam o mapa de Mapeamento → BM. A venda segue o lead pela chave do card. O que não tem vínculo aparece separado, sem estimativa.</li>
      <li>KPI sem meta ou KPI próprio sem valor ficam em branco no slide, para preencher depois.</li></ul></div>`}

/* ───── carga dos dados ───── */
let ultOk=0, cacheTs=0, quieto=false, finBusy=false, cusBusy=false, timer=null;
const RAW={};
function stat(k,t){document.getElementById('dot').className='dot'+(k==='on'?' on':k==='off'?' off':'');
  document.getElementById('st').textContent=t}
const haQuanto=ts=>{const s=Math.round((Date.now()-ts)/1000);
  if(s<10)return 'agora';if(s<60)return 'há '+s+' s';const m=Math.round(s/60);
  if(m<60)return 'há '+m+' min';return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
function tique(){if(busy)return;
  if(ultOk)stat('on',(serieErr?'ao vivo (sem série diária) · ':'ao vivo · ')+haQuanto(ultOk));
  else if(cacheTs)stat('','dados de '+haQuanto(cacheTs))}
/* re-render vindo da atualização automática: sem animação de entrada e sem mexer na área administrativa */
function renderAuto(){if(tab==='admin'){renderAdminStatus&&renderAdminStatus();return}
  quieto=true;document.body.classList.add('quieto');render()}

function ingLeads(cube,serie){
  CUBE=cube.filter(r=>r[0]!=null).map(r=>[nc(r[0]),r[1]==null?'':String(r[1]).trim(),
    r[2]==null?'':String(r[2]).trim(),r[3]==null?'':String(r[3]).trim(),+r[4]||0]);
  SER=serie.map(r=>[gdate(r[0]),r[1]==null?'':nc(r[1]),r[2]==null?'':String(r[2]).trim(),+r[3]||0]).filter(r=>r[0]);
  FRESH.leads=SER.reduce((a,r)=>r[3]>0&&r[0]>a?r[0]:a,'')}
function ingFin(r){
  const rows=r.filter(x=>x[0]!=null).map(x=>({
    id:String(x[0]), sv:String(x[1]||'—').trim()||'—', v:+x[2]||0, np:+x[3]||0,
    vc:gdate(x[4]), ld:gdate(x[5]),
    mi:nc(x[6])||'—', e:String(x[7]||'—').trim().toUpperCase()||'—',
    dc:gdate(x[8]), cs:String(x[9]||'').trim()||'Sem consultor', ck:x[10]==null?'':String(x[10]).trim()}));
  if(!rows.length)return false;
  FIN=rows;buildSales();finLive=true;finErr='';
  FRESH.fin=rows.reduce((a,x)=>x.dc&&x.dc>a?x.dc:a,'');return true}
function ingCusto(meta,ads,off,atv){
  const c=buildCusto(meta,ads,off);
  if(!c.length)return false;
  CUSTO=c;ATIVAS=atv||[];buildCampOn();cusLive=true;cusErr='';
  FRESH.meta=(meta||[]).reduce((a,r)=>{const d=gdate(r[5]);return d&&d>a?d:a},'');
  FRESH.ads=(ads||[]).reduce((a,r)=>{const d=gdate(r[0]);return d&&d>a?d:a},'');return true}

/* cache local: abre o painel na hora com os últimos dados e atualiza por trás */
function salvaCache(){
  try{localStorage.setItem('gwa.cache',JSON.stringify({t:Date.now(),d1,d2,fO,fC,cube:RAW.cube,ser:RAW.ser,
    fin:RAW.fin,meta:RAW.meta,ads:RAW.ads,off:RAW.off,atv:RAW.atv}))}
  catch(e){try{localStorage.removeItem('gwa.cache')}catch(_){}}}
function hidrata(){
  try{const c=JSON.parse(localStorage.getItem('gwa.cache')||'null');if(!c)return false;
    Object.assign(RAW,{fin:c.fin,meta:c.meta,ads:c.ads,off:c.off,atv:c.atv});
    if(c.fin)ingFin(c.fin);
    if(c.meta||c.ads||c.off)ingCusto(c.meta,c.ads,c.off,c.atv);
    if(c.d1===d1&&c.d2===d2&&(c.fO||'TODAS')===fO&&(c.fC||'TODAS')===fC&&c.cube){RAW.cube=c.cube;RAW.ser=c.ser||[];ingLeads(c.cube,c.ser||[]);live=true}
    cacheTs=c.t;return true}catch(e){return false}}

let recarga=false;
async function load(){
  if(busy){recarga=true;return}busy=true;recarga=false;
  stat('','atualizando…');document.getElementById('rf').classList.add('spin');
  const t0=performance.now();
  try{
    const P=prevRange();
    const from=P[0]||d1;
    loadFin();loadCusto();
    /* a série diária é a consulta mais pesada: tempo maior e, se falhar, o resto segue ao vivo */
    const [rc,rs]=await Promise.allSettled([
      gviz(`select ${CAMP}, ${TAB}, ${ORI}, ${CAN}, count(${ID})${wh()} group by ${CAMP}, ${TAB}, ${ORI}, ${CAN}`,40000),
      gviz(`select ${DAT}, ${CAMP}, ${TAB}, count(${ID}) where ${DAT} >= date '${from}' and ${DAT} <= date '${d2}'${filtroOC()} group by ${DAT}, ${CAMP}, ${TAB}`,60000)
    ]);
    if(rc.status!=='fulfilled')throw rc.reason;
    serieErr=rs.status!=='fulfilled';
    RAW.cube=rc.value;RAW.ser=serieErr?[]:rs.value;
    ingLeads(RAW.cube,RAW.ser);
    live=true;ultOk=Date.now();salvaCache();
    logEv('Painel','atualização completa dos leads',true,RAW.cube.length+RAW.ser.length,Math.round(performance.now()-t0));
  }catch(e){
    if(!cacheTs&&!ultOk){live=false;CUBE=SNAP.cube.slice();SER=SNAP.serie.map(x=>[x[0],'','',x[1]]);stat('off','dados salvos')}
  }finally{busy=false;document.getElementById('rf').classList.remove('spin');tique();renderAuto();if(recarga)load()}}

async function loadFin(){
  if(finBusy)return;finBusy=true;
  try{const c=CFG.fin.col;
    const r=await gvizF(`select ${c.lanc}, ${c.servico}, ${c.valor}, ${c.parcela}, ${c.venc}, ${c.dataLead}, ${c.midia}, ${c.empresa}, ${c.confirm}, ${c.consultor}, ${c.card||'C'}`);
    if(ingFin(r)){RAW.fin=r;salvaCache();renderAuto()}
  }catch(e){finErr=e&&e.message?e.message:'erro';if(!FIN.length)renderAuto()}
  finally{finBusy=false}}

/* Proteção contra leitura da planilha de custos no meio de uma atualização:
   se o mês mais recente vier sem nenhuma linha mapeada, ou se uma empresa que tinha gasto zerar de repente,
   a resposta é tratada como incompleta — mantém a última versão boa e tenta de novo em 15 s (até 3 vezes). */
let metaTent=0,cusAviso='';
function metaSuspeita(meta,ant){
  const soma=rows=>{const m={};(rows||[]).forEach(r=>{const v=+r[1]||0;if(!v)return;
    const mes=String(r[0]||'').trim();const map=String(r[2]==null?'':r[2]).trim()!=='';
    const k=mes+'|'+(map?String(r[3]||'').trim().toUpperCase()||'?':'∅');m[k]=(m[k]||0)+v});return m};
  const ord=s=>s.split('/').reverse().join('');
  const N=soma(meta);
  const meses=[...new Set(Object.keys(N).map(k=>k.split('|')[0]))].filter(x=>/^\d{1,2}\/\d{4}$/.test(x)).sort((a,b)=>ord(b).localeCompare(ord(a)));
  const ult=meses[0];
  if(ult){const mapeado=Object.entries(N).filter(([k])=>k.startsWith(ult+'|')&&!k.endsWith('|∅')).reduce((s,[,v])=>s+v,0);
    if(mapeado===0)return `nenhuma linha mapeada em ${ult}`}
  if(ant&&ant.length){const A=soma(ant);
    for(const [k,v] of Object.entries(A)){if(k.endsWith('|∅')||v<500)continue;
      if((N[k]||0)<v*0.1)return `gasto de ${k.replace('|',' · ')} caiu de ${Math.round(v)} para ${Math.round(N[k]||0)}`}}
  return ''}
async function loadCusto(){
  if(cusBusy)return;cusBusy=true;
  try{const m=CFG.custos.meta,a=CFG.custos.ads;
    let [meta,ads,off,atv]=await Promise.all([
      gvizK(SH_META,`select ${m.mes}, ${m.gasto}, ${m.campanha}, ${m.empresa}, ${m.empConta}, ${m.atualiz}, ${m.conta||'D'}, ${m.nome||'B'}`).catch(()=>null),
      gvizK(SH_ADS,`select ${a.dia}, ${a.status}, ${a.canal}, ${a.custo}, ${a.orcamento}, ${a.campanha}, ${a.empresa}`).catch(()=>null),
      gvizK(SH_OFF,"select *",0).catch(()=>null),
      gvizK(SH_ATV,"select E, L").catch(()=>null)
    ]);
    if(meta){const sus=metaSuspeita(meta,RAW.meta);
      if(sus&&metaTent<3){metaTent++;cusAviso=sus;
        logEv('Custos · '+SH_META,'resposta incompleta ('+sus+')',false,meta.length,0,
          (RAW.meta&&RAW.meta.length?'mantida a versão anterior':'usada mesmo assim')+'; nova tentativa em 15 s');
        setTimeout(()=>loadCusto(),15000);
        if(RAW.meta&&RAW.meta.length)meta=null}
      else{if(sus)logEv('Custos · '+SH_META,'aceita após 3 tentativas: '+sus,false,meta.length);metaTent=0;cusAviso=sus?sus:''}}
    /* se uma aba falhar, mantém a última versão boa dela */
    const M=meta||RAW.meta||[],A=ads||RAW.ads||[],O=off||RAW.off||[],V=atv||RAW.atv||[];
    if(ingCusto(M,A,O,V)){Object.assign(RAW,{meta:M,ads:A,off:O,atv:V});salvaCache();renderAuto()}
    else {cusErr='sem linhas';renderAuto()}
  }catch(e){cusErr=e&&e.message?e.message:'erro';renderAuto()}
  finally{cusBusy=false}}
